# 台灣媒體背景對照表
#
# 用途：fc.py media <網址或名稱> 只從這張表查媒體背景，模型不得自行推論媒體立場。
# 每一列都附上實際開啟過的來源。沒有可引用研究的媒體就不放 lean，這是刻意的。
#
# 欄位說明
# - trust：只取自 Reuters Institute Digital News Report（CC BY 4.0）。score 是受訪者在 0–10 分量表給 6–10 分
#   （編為「信任」）的百分比；沒聽過該品牌的人不列入計算。這是民眾主觀評價的彙總，不是對媒體可信度的客觀評定。
#   brand 是報告原文的品牌名稱，方便回查。
# - lean：只取自學術期刊或研究機構的研究，label 照研究本身的說法改寫，year 是出版年，data_years 是研究資料的年份。
# - ownership：營運主體與登記資料。「商工登記」指經濟部商工登記公示資料（data.gcis.nat.gov.tw 開放資料 API），
#   查詢日 2026-11-17；董監事的「法人代表」是登記內容，不代表本表推論誰是實際控制者。
#   ownership_source 為主要來源，ownership_source_2 為輔助來源（選填）。
# - record：只記媒體層級的正式紀錄（NCC 處分、更正頁、研究發現），不評價個別記者。
# - 網域比對採「完全相同或為其子網域」且取第一個符合者，所以子網域較長的媒體（例如 money.udn.com）要排在前面。

schema_version = 1
updated = "2026-11-17"
license = "CC BY-SA 4.0"
trust_report = "Reuters Institute Digital News Report 2026（CC BY 4.0），台灣品牌信任度表見 PDF 第 160 頁"
trust_report_pdf = "https://reutersinstitute.politics.ox.ac.uk/sites/default/files/2026-06/DNR%202026%20FINAL_2.pdf"


# ───────────── 歸因 ─────────────
# 歸因層只能寫「特徵和 X 相符，但無法確認背後是誰」，除非引用政府、學術機構或平台針對該案例的正式報告。
# 下面案例的 summary 會寫明是哪個單位點名了操作者。

[[tactic]]
id = "TW-T29"
name = "網軍、境外資訊操作"
category = "歸因"
layer = "attribution"
definition = "有組織的團體（包括外國政府或它的代理人）用大量帳號、媒體或協力者，有計畫地散布特定說法、帶風向。這是在講「誰在背後」，不是內容本身看得出來的特徵。"
observable = [
  {id = "a", kind = "verified", text = "大量新帳號或異常帳號在短時間內轉傳同一則內容"},
  {id = "b", kind = "verified", text = "同一個說法先出現在境外官媒或平台，再轉進台灣社群"},
  {id = "c", kind = "verified", text = "政府、研究機構或平台的正式報告點名了這個案例"},
]
cannot_infer = "內容的立場、用語（例如有簡體字或中國用語）或傳播方式，都不能確定是誰在操作；只有政府、學術機構或平台針對這個特定案例的正式報告點名，才能寫出背後是誰。沒有這類報告時，不標這個手法，只在溯源的傳播跡象裡描述看到的現象。另外，把意見不同的人直接叫「網軍」，本身也是一種貼標籤。"
how_to_spot = "先找國安單位、研究機構或平台有沒有報告點名這個案例；沒有的話，只描述看到的傳播跡象，不要說是誰。"
disarm = ["T0049.001", "T0091.003"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0049.001.md"]


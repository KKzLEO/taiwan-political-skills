org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-10884/"
date = "2024-08-06"

[[tactic.example]]
target = "民眾黨"
summary = "網傳柯文哲年輕時的當兵照「高腰褲、胯下有水漬」，配上「這副德性選總統？」；查核發現原始照片是他1986年入伍時的舊照，網傳版本被刻意修圖拉高褲頭、加上水漬。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-10010/"

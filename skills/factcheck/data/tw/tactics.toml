# ───────────── 傳播跡象 ─────────────

[[tactic]]
id = "TW-T26"
name = "內容農場"
category = "傳播跡象"
layer = "spread"
definition = "大量產製拼湊、聳動、沒有署名內容的網站或影音頻道，多半靠流量賺錢或累積觀眾，常把舊聞、謠言和不相干的畫面拼在一起。"
observable = [
  {id = "a", kind = "clue", text = "網站或頻道沒有作者、聯絡方式或登記資料"},
  {id = "b", kind = "verified", text = "每天固定大量上片，標題都用「完了」「慘遭」這類開頭"},
  {id = "c", kind = "clue", text = "用機器配音或 AI 畫面，內容東拼西湊、沒有消息來源"},
]
cannot_infer = "是內容農場不代表每一則都是假的，也不能從這點推論背後是哪個國家或政黨在經營。"
how_to_spot = "看這個網站或頻道的其他內容：如果都是同一種聳動標題、沒有署名，就要特別小心。"
disarm = ["T0096", "T0049.007"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0096.md"]


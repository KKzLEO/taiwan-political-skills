[[tactic]]
id = "TW-T19"
name = "轉移焦點（「那你們之前呢」）"
category = "邏輯謬誤"
layer = "content"
definition = "被批評時不回應問題本身，而是改講對方過去也做過、或以前更糟，把焦點從眼前的事移開。"
observable = [
  {id = "a", kind = "visible", text = "「那你們執政時呢」「當年是誰提的」這類反問"},
  {id = "b", kind = "visible", text = "拿另一個時期、另一件事來比，跳過原本被質疑的重點"},
  {id = "c", kind = "verified", text = "拿來比的那件事，年份或內容常常講錯"},
]
cannot_infer = "對方以前做過，不代表現在的批評不成立；現在的批評成立，也不代表對方以前就沒問題。兩件事要分開查。"
how_to_spot = "把「那你們之前呢」先放一邊，問：原本被質疑的那件事，答案是什麼？"

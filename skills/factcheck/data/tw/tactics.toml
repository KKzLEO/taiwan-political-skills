[[tactic]]
id = "TW-T12"
name = "假專家、借用權威"
category = "來源與冒名"
layer = "content"
definition = "搬出「專家」「學者」「醫師」來替說法背書，但專家是假的、名字被盜用，或他其實沒說過那樣的結論。"
observable = [
  {id = "a", kind = "visible", text = "只寫「日本學者」「美國專家」「台大醫師」這類沒有名字的頭銜"},
  {id = "b", kind = "clue", text = "查不到這個人或他的原始發言"},
  {id = "c", kind = "clue", text = "影片中的醫師長相、聲音和本人不符"},
  {id = "d", kind = "verified", text = "專家講的內容和他的專業領域無關，或結論比原話誇大很多"},
  {id = "e", kind = "verified", text = "機構或本人公開表示查無此人，或沒有這段發言"},
]
cannot_infer = "頭銜是假的不代表結論一定錯，頭銜是真的也不代表結論一定對；要回到證據本身。"
how_to_spot = "查這位專家本人有沒有公開說過同樣的話，以及他的專業是不是和這個題目有關。"
disarm = ["T0045"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0045.md"]


[[tactic]]
id = "TW-T09"
name = "冒用官方或媒體名義"
category = "來源與冒名"
layer = "content"
definition = "在內容上放政府機關、查核機構或媒體的名稱、標誌，或把別的影片包裝成新聞畫面，借用對方的公信力讓人相信。"
observable = [
  {id = "a", kind = "clue", text = "圖卡有機關或媒體的標誌，但官網和官方帳號都找不到"},
  {id = "b", kind = "clue", text = "所謂「外國新聞畫面」沒有台標，或內容和主播講的話對不上"},
  {id = "c", kind = "verified", text = "網址、帳號名稱和官方的只差幾個字"},
  {id = "d", kind = "verified", text = "被冒名的機關或媒體公開否認，或官方紀錄查得到不同的內容"},
]
cannot_infer = "有標誌不代表是官方發的，沒標誌也不代表是假的；冒用名義也不能推論背後是誰。"
how_to_spot = "直接到該機關或媒體的官網、官方帳號找同一則消息。"
disarm = ["T0097.206", "T0097.202", "T0143.003"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0097.206.md"]

[[tactic.example]]
target = "政府機關"
summary = "網傳印有交通部字樣的圖卡稱9月有12項機車交通新制上路；查核發現圖卡不是交通部或公路局發的，內容多是舊制，還夾雜錯誤資訊。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/september-scooter-traffic-rules/"
date = "2026-09-07"

[[tactic.example]]

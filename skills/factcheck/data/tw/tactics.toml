# 操弄手法庫：這裡收的是「手法」，不是立場或敘事。
# example.target 是被攻擊、被抹黑或被扭曲的一方，不是散布者（散布者屬於歸因，不在這裡判斷）。
# 每個案例都附查核或研究報告的網址與發布日期。
# observable 是可以觀察的特徵，id 是穩定代號（刪掉的不重用）。kind：
#   visible  看得到：訊息文字裡看得到的正面跡象
#   verified 查證得到：查外部資料得到的正面證據
#   clue     只是線索：缺少資訊或間接跡象，不能單獨撐起標記；角色看不到影像之前，畫面類特徵也歸這一類

# ───────────── 脈絡操弄 ─────────────

[[tactic]]
id = "TW-T01"
name = "斷章取義"
category = "脈絡操弄"
layer = "content"
definition = "只截一句話或一小段，拿掉前後文，讓人以為當事人在講另一件事，或意思和原本相反。"
observable = [
  {id = "a", kind = "clue", text = "只有一句話或幾秒鐘片段，沒有附完整影片或全文"},
  {id = "b", kind = "verified", text = "引用的話被接到原本沒有談到的人或事件上"},
  {id = "c", kind = "verified", text = "標題或說明文字的解讀比原句更強烈"},
]
cannot_infer = "截得不完整不代表一定是故意的；也不能拿來判斷當事人原本的立場對不對，只能說這個片段撐不起傳言的說法。"
how_to_spot = "找到完整影片或全文，看這句話前後在講什麼、是在回答哪個問題。"
context_flag = "out_of_context"
disarm = ["T0023.001"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0023.001.md"]

[[tactic.example]]
target = "國民黨"
summary = "網傳台中市長盧秀燕回應幼兒園疑似性侵案時說「吃飽太閒」；查核發現這句話是在回應中正路改名，對幼兒園案她說的是「正在調查中」。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/lu-xiuyan-remark-about-road-renaming-not-kindergarten-case/"
date = "2025-05-28"

[[tactic.example]]
target = "民進黨"
summary = "網傳川普說「有合適的總統就不會有戰爭」是在暗指賴清德是麻煩製造者；查核比對白宮記者會原始脈絡，川普說的「合適總統」指的是他自己。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/trump-suitable-president-comment-misquoted-lai/"
date = "2026-05-15"

[[tactic.example]]
target = "政府機關"
summary = "網傳農業部長陳駿季說馬太鞍溪堰塞湖「沒有立即危險」卻還是潰堤；查核指出這是他8月的答詢片段，完整發言有說明當時蓄水未滿、開挖風險高等前提。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/factcheck-mataian-creek-dam-overflow-minister-quote-misused/"
date = "2025-09-26"

[[tactic]]
id = "TW-T02"
name = "剪接移花接木（影音）"
category = "脈絡操弄"
layer = "content"
definition = "把影片或錄音剪掉關鍵字句、重新排列，或把不同場合的片段拼在一起，做出當事人沒有表達過的意思。"
observable = [
  {id = "a", kind = "clue", text = "畫面或聲音有跳接，同一句話被重複播放"},
  {id = "b", kind = "clue", text = "片段很短，看不到記者的提問或前一句話"},
  {id = "c", kind = "verified", text = "不同場合的畫面被接在一起，再配上新的標題或字幕"},
]
cannot_infer = "影片被剪過不代表內容全是假的，也看不出是誰剪的；要和原始完整影音比對，才知道哪裡被改了。"
how_to_spot = "用畫面上的台標、浮水印或關鍵字找原始完整影片，對照時間點看哪幾句被剪掉。"
context_flag = "out_of_context"
disarm = ["T0087.002", "T0088.002"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0087.002.md"]

[[tactic.example]]
target = "民進黨"
summary = "網傳影片中賴清德喊出「變成中國台灣，大家說好不好」；查核發現影片剪掉前半句，原句是「絕對不讓民主台灣走回頭路，變成中國台灣」。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/lai-ching-te-speech-edited-video-china-taiwan-claim-fabricated/"
date = "2026-10-05"

[[tactic.example]]
target = "國民黨"
summary = "網傳影片稱韓國瑜說賴清德是「礦工的兒子憑什麼當副總統」；查核發現影片只擷取20秒、拿掉「沒有中華民國的保護，沒有政府的照顧」這句，傳言文字還加上原話沒有的「憑什麼」。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-10145/"
date = "2024-01-11"

[[tactic]]
id = "TW-T03"
name = "舊圖舊影片新用"
category = "脈絡操弄"
layer = "content"
definition = "把過去或其他地方的照片、影片配上新的說明，當成最近發生的事，或當成另一件事的證據。"
observable = [
  {id = "a", kind = "clue", text = "畫面裡的季節、服裝、招牌或人物樣貌和說明對不上"},
  {id = "b", kind = "clue", text = "畫質很差、有舊的浮水印，或看得出被轉存很多次"},
  {id = "c", kind = "verified", text = "以圖搜圖可以找到時間更早的版本"},
]
cannot_infer = "畫面本身可能是真的；舊圖新用只表示它不能證明傳言講的那件事，也看不出是誰挪用的。"
how_to_spot = "用以圖搜圖（例如 Google 智慧鏡頭）找這張圖或這段影片最早出現的時間和場合。"
context_flag = "recycled_media"
disarm = ["T0084.003"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0084.003.md"]

[[tactic.example]]
target = "國民黨"
summary = "網傳影片稱韓國瑜呼籲反對罷免的人不要出門投票、去監票就好；查核發現這是2020年高雄市長罷免案前的舊影片，他在2025年罷免案中其實呼籲大家去投票。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/old-video-of-han-kuo-yu-recall-remarks-resurfaces/"
date = "2025-07-11"

[[tactic.example]]
target = "民進黨"
summary = "網傳影片稱蔡英文呼籲7月26日回家投同意罷免票；查核發現這是2020年總統大選前的舊影片，被刪掉大選內容後再加上罷免字幕和圖卡。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/tsai-ing-wen-vote-july-26-video-reused-from-2020/"
date = "2025-07-11"

[[tactic.example]]
target = "民眾黨"
summary = "網傳照片稱柯文哲去中國時和女性合影、配上「任柯挑選」文字；查核發現照片是2018年他在台北電音派對和台灣網紅的合照。"
org = "MyGoPen"
url = "https://www.mygopen.com/2023/11/2018.html"
date = "2023-11-03"

[[tactic]]
id = "TW-T04"
name = "舊聞新炒"
category = "脈絡操弄"
layer = "content"
definition = "把幾年前的新聞、早就結束的事件，或已經被澄清過的謠言，重新包裝成「最新消息」再傳一次。"
observable = [
  {id = "a", kind = "clue", text = "內容沒有寫日期，或只用「本週」「最近」「明天起」這類模糊時間"},
  {id = "b", kind = "verified", text = "同樣的內容過去已經被查核過"},
  {id = "c", kind = "verified", text = "提到的職稱、政策或法案進度和現在對不上"},
]
cannot_infer = "舊消息重傳不代表當年的內容是假的，也不能推論轉傳的人知道它已經過時。"
how_to_spot = "拿內容裡的關鍵句去搜尋，看它最早什麼時候出現，事情後來怎麼發展。"
context_flag = "old_news"
disarm = ["T0084"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0084.md"]

[[tactic.example]]
target = "國民黨"
summary = "網傳圖卡稱「軍人效忠中共取消退休金」的法案「本週」被國民黨擋下；查核發現這張圖2025年5月就流傳過，講的是當時的程序爭議，不是近期的事。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/outdated-claim-kmt-blocked-military-pension-bill/"
date = "2026-10-28"

[[tactic.example]]
target = "政府機關"
summary = "網傳台電圖卡稱「明天起電費分三段式」；查核指出這是2020年起就被查核過的老謠言，一般住家是累進電價，和用電時段無關。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/three-tier-electricity-rate-rumor-resurfaces/"
date = "2025-06-23"

[[tactic.example]]
target = "國民黨"
summary = "網傳影片稱吳敦義卸下公職後才說出「談統不切實際」的真心話，搭著近期陸配事件流傳；查核發現影片是他2017年競選黨主席時的專訪。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/wu-den-yih-2017-cross-strait-remarks-miscontextualized/"
date = "2025-04-11"

[[tactic]]
id = "TW-T05"
name = "把提案說成已通過"
category = "脈絡操弄"
layer = "content"
definition = "把還在提案、一讀、委員會審查或草案預告階段的法案，說成已經通過或馬上上路，用來製造恐慌或攻擊提案的一方。"
observable = [
  {id = "a", kind = "clue", text = "用「已三讀」「已通過」「明年起」等字眼，卻沒有附立法院的議事紀錄"},
  {id = "b", kind = "verified", text = "把提案、草案、預告和定案混在一起講"},
  {id = "c", kind = "clue", text = "只講是誰提的、哪一黨的，不講法案現在走到哪一步"},
]
cannot_infer = "進度講錯不代表提案內容沒有爭議；法案內容好不好，要另外討論。"
how_to_spot = "到立法院議事暨公報資訊網或公共政策網路參與平台，查這個案子現在的進度。"
context_flag = "legal_stage_confusion"

[[tactic.example]]
target = "國民黨"
summary = "網傳國民黨立委提的選罷法修正案「已二讀通過」、罷免門檻將提高；查核發現該案只完成一讀，交付內政委員會審查。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-10619/"
date = "2024-05-22"

[[tactic.example]]
target = "民進黨"
summary = "網傳圖卡稱民進黨立委莊瑞雄提案處罰「記錄他人進出投票所」是在為2024作票做準備；查核指出這是仍在審議、尚未通過的修法草案，傳言錯把它說成是為了作票。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-9946/"
date = "2023-11-29"

[[tactic]]
id = "TW-T06"
name = "數字缺分母、選擇性數據"
category = "脈絡操弄"
layer = "content"
definition = "只給總數不給比例，或只挑對自己有利的年份、項目來比，讓數字看起來支持某個結論。"
observable = [
  {id = "a", kind = "clue", text = "只有人數或金額，沒有母數、比例或比較基準"},
  {id = "b", kind = "visible", text = "拿來比的年份、範圍或單位不一致"},
  {id = "c", kind = "verified", text = "只挑最高點或最低點，不看整體變化"},
]
cannot_infer = "數字本身可能是對的，問題出在比較方式；也不能因此就說相反的結論成立。"
how_to_spot = "先問「跟什麼比？分母是多少？」，再找完整的官方統計自己算一次。"
context_flag = "missing_denominator"
disarm = ["T0023"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0023.md"]

[[tactic.example]]
target = "政府機關"
summary = "網傳指揮中心數據顯示「打滿三劑死的比沒打的多」；專家指出要用各劑次的接種人數當分母算死亡率，直接比死亡人數是錯誤的推論。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-7769/"
date = "2022-07-04"

[[tactic.example]]
target = "國民黨"
summary = "網傳圖卡比較四個直轄市的油品檢驗次數，說台北4年沒驗、台中8年只驗一次；查核發現圖卡有的只算單一油廠、有的算全部，基期也不一致，不能直接比較。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/oil-inspection-data-comparison/"
date = "2026-08-07"

[[tactic]]
id = "TW-T07"
name = "錯譯、捏造字幕"
category = "脈絡操弄"
layer = "content"
definition = "拿外國官員或名人的真實畫面，配上和原音意思不同的中文字幕或翻譯，讓人以為對方說了某句話。"
observable = [
  {id = "a", kind = "clue", text = "字幕常是簡體字，或用語不像台灣的媒體"},
  {id = "b", kind = "clue", text = "字幕的長度、語氣和畫面裡講話的節奏對不上"},
  {id = "c", kind = "clue", text = "這麼重大的發言，卻找不到外媒報導或官方逐字稿"},
  {id = "d", kind = "verified", text = "官方逐字稿或可靠的完整翻譯，和字幕的內容不同"},
]
cannot_infer = "字幕被編造不代表原始畫面是假的；也看不出是誰加上字幕的。"
how_to_spot = "找原始畫面的出處和官方逐字稿，或把原音丟進翻譯工具，對照字幕說的是不是同一件事。"
disarm = ["T0084.003"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0084.003.md"]

[[tactic.example]]
target = "民進黨"
summary = "網傳美國記者會影片字幕稱美方說不會收留「逃到美國」的蔡英文，還罵她背叛祖國；查核發現兩段畫面是談別的事的白宮與五角大廈簡報，字幕是捏造的。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-8154/"
date = "2022-09-14"

[[tactic.example]]
target = "外國政府"
summary = "網傳影片字幕稱白宮發言人說美國只想讓台海兩岸自相殘殺、賣武器而已；查核發現原始畫面是2021年白宮記者會回答墮胎議題，字幕和原音不符。"
org = "台灣事實查核中心"
url = "https://tfc-taiwan.org.tw/fact-check-reports/migration-8075/"
date = "2022-08-29"

# ───────────── 來源與冒名 ─────────────

[[tactic]]
id = "TW-T08"
name = "偽造截圖、假公文、假新聞截圖"
category = "來源與冒名"
layer = "content"
definition = "做出看起來像官方公文、對話紀錄、新聞報導或照片的圖片，或把真的截圖、照片改掉部分內容，拿來當作「證據」。"
observable = [
  {id = "a", kind = "clue", text = "公文格式、用語不像台灣官方，或出現簡體字、中國用語"},
  {id = "b", kind = "clue", text = "截圖的字距、對齊、字型不一致，或關鍵欄位被裁掉"},
  {id = "c", kind = "clue", text = "找不到這張公文或這則報導的原始出處"},
  {id = "d", kind = "verified", text = "發文機關或被冒名者公開否認，或官方紀錄查得到不同的內容"},
]
cannot_infer = "看出偽造痕跡不等於知道是誰做的；反過來，看不出痕跡也不代表是真的。"
how_to_spot = "去發文機關或媒體的官網找原件，找不到就先當成來源不明。"
disarm = ["T0085.004", "T0089.003", "T0086.003"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0089.003.md"]

[[tactic.example]]
target = "民進黨"

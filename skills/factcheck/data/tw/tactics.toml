]
cannot_infer = "看出假兩難只表示訊息列出的選項比實際少，不代表那兩個選項本身是錯的，也不代表對方是故意的。"
how_to_spot = "問自己：真的只有這兩條路嗎？查一下官方規定有沒有第三種做法。"


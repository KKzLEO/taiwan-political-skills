[[tactic]]
id = "TW-T11"
name = "匿名爆料、「內部人士」"
category = "來源與冒名"
layer = "content"
definition = "用「內部人士透露」「朋友在醫院工作說」「暗網外流」這類查不到的來源，讓沒有證據的說法聽起來像內幕。"
observable = [
  {id = "a", kind = "visible", text = "提供消息的人只寫「據了解」「知情人士」「朋友說」這類匿名說法（訊息說某個沒寫名字的人說了或做了某件事時，他是被指稱的對象，不算）"},
  {id = "b", kind = "clue", text = "消息來源沒有名字也沒有文件"},
  {id = "c", kind = "verified", text = "源頭是剛註冊的帳號、匿名論壇或來路不明的檔案"},
  {id = "d", kind = "visible", text = "強調「新聞都不敢報」「被封鎖了」"},
]
cannot_infer = "匿名不等於一定是假的，新聞也會保護消息來源；但光靠匿名說法不能證明任何事，也看不出是誰放出來的。"
how_to_spot = "問一句「誰說的？有沒有文件或第二個獨立來源？」找不到就先別轉。"


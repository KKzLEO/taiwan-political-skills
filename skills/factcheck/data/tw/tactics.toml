# ───────────── 邏輯謬誤 ─────────────

[[tactic]]
id = "TW-T18"
name = "稻草人"
category = "邏輯謬誤"
layer = "content"
definition = "先把對方的主張講歪、講到最極端，再去攻擊這個被扭曲的版本，好像這樣就駁倒了對方。"
observable = [
  {id = "a", kind = "clue", text = "「他們就是要……」這類轉述，卻沒有附對方原話或法條"},
  {id = "b", kind = "verified", text = "把「加重」說成「放寬」、把「要求」說成「要公投」這種反轉"},
  {id = "c", kind = "verified", text = "被批評的內容，對方其實從來沒有主張過"},
]
cannot_infer = "抓到稻草人不代表被攻擊的一方就是對的，只代表這段批評打錯了對象。"
how_to_spot = "找對方的原始發言或法條原文，對照轉述的版本差在哪裡。"
disarm = ["T0023"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0023.md"]


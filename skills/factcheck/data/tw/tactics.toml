[[tactic]]
id = "TW-T30"
name = "假旗行動"
category = "歸因"
layer = "attribution"
definition = "操作者假裝成另一方（例如某政黨的支持者、台灣在地團體或外國人）發布內容，讓人以為是那一方說的、做的，藉此抹黑對方或挑起對立。"
observable = [
  {id = "a", kind = "verified", text = "帳號或網站自稱某陣營或在地團體，但成立時間很短、沒有其他活動紀錄"},
  {id = "b", kind = "verified", text = "用語、時區或網站主機位置和自稱的身分對不上"},
  {id = "c", kind = "clue", text = "內容刻意誇張，好像是要讓自稱的那一方難堪"},
]
cannot_infer = "就算帳號身分看起來可疑，也不能從內容特徵確定真正的操作者，更不能反過來推論是對手陣營做的；只有政府、學術機構或平台針對這個特定案例的正式報告點名，才能寫出背後是誰。"
how_to_spot = "查帳號或網站的成立時間、過去貼文，以及有沒有官方或平台的調查報告；沒有報告就只說「身分無法確認」。"
disarm = ["T0129.010", "T0097.101"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0129.010.md"]


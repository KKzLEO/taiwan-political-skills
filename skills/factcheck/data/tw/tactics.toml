[[tactic]]
id = "TW-T25"
name = "影射暗示（只是問問）"
category = "人身攻擊與抹黑"
layer = "content"
definition = "不直接指控，而是用「是不是」「值得追問」「合理懷疑」這類問句或暗示，讓人自己往壞處想，被追究時又能說「我只是問問」。"
observable = [
  {id = "a", kind = "visible", text = "用問句或「合理揣測」暗示一項沒有明說的事實指控"},
  {id = "b", kind = "clue", text = "提出的「疑點」沒有附任何證據"},
  {id = "c", kind = "clue", text = "常搭配來源不明的錄音、截圖或查詢網站"},
]
cannot_infer = "提出疑問是正當的，但問句本身不是證據，「被質疑」也不等於「被證實」。"
how_to_spot = "把問句改成肯定句，再問自己：有任何證據支持這句話嗎？"
disarm = ["T0140.001"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0140.001.md"]


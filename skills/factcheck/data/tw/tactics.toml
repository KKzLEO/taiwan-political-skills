url = "https://tfc-taiwan.org.tw/fact-check-reports/fake-minshi-image-criticizing-wu-ya-xin/"
date = "2025-08-14"

[[tactic]]
id = "TW-T10"
name = "冒用名人說話（假語錄）"
category = "來源與冒名"
layer = "content"
definition = "把一篇文章或一段話掛上政治人物、名人的名字，讓人以為是他本人說的，常見做法是拿別人的文章改掉作者。"
observable = [
  {id = "a", kind = "clue", text = "長篇文章掛名某人，但本人的臉書、官網都沒有"},
  {id = "b", kind = "clue", text = "文中的語氣或立場和當事人平常差很多，例如綠營人物突然大力替藍營說話、或反過來"},
  {id = "c", kind = "verified", text = "同一篇文字在網路上曾掛過不同人的名字"},
  {id = "d", kind = "verified", text = "當事人或其辦公室公開否認說過"},
]
cannot_infer = "假語錄只說明那段話不是當事人說的，不能拿來推論當事人真正的想法，也看不出是誰編的。"
how_to_spot = "到當事人的官方帳號找原文，再拿文中一段話去搜尋，看有沒有更早、掛別人名字的版本。"


[[tactic]]
id = "TW-T13"
name = "假民調、曲解民調"
category = "來源與冒名"
layer = "content"
definition = "公布不存在的民調公司做的「民調」，或用方法不專業的調查、網路問卷冒充正式民調，影響大家對選情的判斷。"
observable = [
  {id = "a", kind = "clue", text = "查不到這家民調公司，或沒有公布樣本數、調查時間和方法"},
  {id = "b", kind = "verified", text = "結果和同時期其他民調差很多，卻只在特定網站或群組流傳"},
  {id = "c", kind = "verified", text = "把網路投票、媒體自辦問卷說成正式民調"},
]
cannot_infer = "民調結果不合預期不代表是假的；方法不嚴謹也不代表有人在背後操作，除非有司法或調查報告。"
how_to_spot = "找民調的執行單位、樣本數和調查方法；三樣都找不到，就不要當真。"
disarm = ["T0085.007"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0085.007.md"]


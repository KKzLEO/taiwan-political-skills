[[tactic]]
id = "TW-T27"
name = "協同散布"
category = "傳播跡象"
layer = "spread"
definition = "很多帳號在短時間內貼出幾乎一樣的文案、影片或留言，或用同一份稿子重錄成不同版本，讓某個說法看起來很多人在講。"
observable = [
  {id = "a", kind = "verified", text = "不同帳號貼出一字不差、或只改幾個字的文案"},
  {id = "b", kind = "verified", text = "新帳號或平常不活躍的帳號同時大量轉貼"},
  {id = "c", kind = "verified", text = "同一份旁白被不同帳號重新錄製、換上不同畫面"},
]
cannot_infer = "看到協同的跡象，只能說「觀察到協同散布」，不能判斷是誰在指揮，也不能推論所有轉貼的人都是假帳號。"
how_to_spot = "複製一段文字去搜尋，看是不是很多帳號在差不多時間貼出一樣的內容。"
disarm = ["T0084.001", "T0119", "T0049.003"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0084.001.md"]


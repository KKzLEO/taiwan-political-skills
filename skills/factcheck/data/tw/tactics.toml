# ───────────── 情緒操弄 ─────────────

[[tactic]]
id = "TW-T15"
name = "情緒煽動與恐慌"
category = "情緒操弄"
layer = "content"
definition = "用「完了」「太可怕」這類字眼，或說你的福利、健保、存款要被拿走，先讓人害怕或生氣，讓人來不及查證就相信。"
observable = [
  {id = "a", kind = "visible", text = "大量驚嘆號，或「完了」「快看」「太扯」等字眼"},
  {id = "b", kind = "visible", text = "強調會失去錢、健康、安全或自由"},
  {id = "c", kind = "clue", text = "只有結論和情緒，沒有可以查證的來源或數字"},
]
cannot_infer = "情緒很強烈不代表內容一定是假的；會害怕或生氣也很正常，這只是提醒你先停下來查一下。"
how_to_spot = "看完覺得很生氣或很害怕時，先停一下，找到原始出處再決定要不要轉。"
disarm = ["T0138.002"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0138.002.md"]


[[tactic]]
id = "TW-T14"
name = "AI 生成或深偽影音"
category = "來源與冒名"
layer = "content"
definition = "用 AI 生成、換臉、換嘴型或合成聲音，做出某人沒說過的話、沒做過的事的影片、照片或錄音。"
observable = [
  {id = "a", kind = "clue", text = "嘴型和聲音對不太上，臉部邊緣、牙齒或眼睛反光不自然"},
  {id = "b", kind = "clue", text = "背景物件扭曲、字糊掉，或同一段畫面被正放、倒放拉長"},
  {id = "c", kind = "clue", text = "只有這一份影音，找不到其他角度或原始出處"},
  {id = "d", kind = "verified", text = "找到原始影音，或當事人、檢調的正式說明，證實這份影音是合成或竄改的"},
]
cannot_infer = "看起來像 AI 不等於確定是 AI，看起來很真也不代表是真的；就算確定是深偽，也看不出是誰做的。"
how_to_spot = "找原始影片或節目來比對，再看當事人、檢調或查核機構有沒有出面說明。"
disarm = ["T0087.001", "T0088.001", "T0086.002"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0087.001.md"]


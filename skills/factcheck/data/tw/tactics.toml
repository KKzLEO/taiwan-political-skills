[[tactic]]
id = "TW-T24"
name = "貼標籤、扣帽子"
category = "人身攻擊與抹黑"
layer = "content"
definition = "用「網軍」「1450」「小粉紅」「中共同路人」「賣國賊」這類標籤套在對方身上，直接否定對方，不必回應對方說了什麼。指控別人是網軍，本身也常是一種抹黑。"
observable = [

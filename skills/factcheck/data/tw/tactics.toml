# ───────────── 人身攻擊與抹黑 ─────────────

[[tactic]]
id = "TW-T23"
name = "人身攻擊與私德抹黑"
category = "人身攻擊與抹黑"
layer = "content"
definition = "不談政策或事實，而是捏造或誇大對方的私生活、品格、金錢問題，讓人對這個人反感。"
observable = [
  {id = "a", kind = "visible", text = "焦點放在外遇、私吞、洗錢這類個人醜聞"},
  {id = "b", kind = "clue", text = "只有指控沒有證據，或證據是P圖、匿名說法"},
  {id = "c", kind = "visible", text = "和正在討論的公共議題沒有關係"},
]
cannot_infer = "抹黑內容被證實是假的，不代表當事人其他作為都沒問題；但沒有證據的私德指控不能當成事實。"
how_to_spot = "問：這個指控有沒有文件、判決或可查證的報導？還是只有一張圖和一段話？"
disarm = ["T0135.001", "T0140.001"]
refs = ["https://github.com/DISARMFoundation/DISARMframeworks/blob/main/generated_pages/techniques/T0140.001.md"]


# 台灣查核用的第一手與官方入口
#
# tier：1 第一手原始資料、2 官方說明、3 獨立可靠媒體／通訊社、4 具名專家分析與查核機構、
#       5 利害關係人自述、6 來源不明
# 每個網址都在 2026-11-17 以自動化工具檢查過。少數網站有防機器人驗證，自動化工具讀不到，
# notes 會註明；status = "inactive" 表示已停止更新。

schema_version = 1
updated = "2026-11-17"

# ───────────── 第一手原始資料（tier 1） ─────────────

[[source]]
id = "moj-law"
name = "全國法規資料庫"
url = "https://law.moj.gov.tw/"
tier = 1
covers = ["中央法規現行條文", "法規沿革", "司法解釋", "條約協定", "兩岸協議"]
notes = "法務部維護。引用條文時記下條號與「修正日期」，確認是不是命題當時的版本。"

[[source]]
id = "ly-lis"
name = "立法院法律系統"
url = "https://lis.ly.gov.tw/lglawc/lglawkm"
tier = 1
covers = ["法律立法歷程", "條文異動對照", "立法理由"]
notes = "查某條文何時、由誰提案、如何修正，比新聞轉述可靠。"

[[source]]
id = "ly-ivod"
name = "立法院議事轉播（IVOD）"
url = "https://ivod.ly.gov.tw/"
tier = 1
covers = ["立委質詢發言", "委員會", "院會", "公聽會"]
notes = "原始影音。查「某立委說了什麼」時，以影片前後文為準，並記下會議名稱、日期與時間碼。"

[[source]]
id = "ly-ppg"
name = "立法院議事暨公報資訊網"
url = "https://ppg.ly.gov.tw/ppg/"
tier = 1
covers = ["議案與提案", "表決紀錄", "立法院公報", "委員會議事錄"]
notes = "查提案人、連署人、表決結果與公報紀錄。公報是正式紀錄，優先於會後新聞稿。"

[[source]]
id = "ly-meet"
name = "立法院議事及發言系統"
url = "https://lis.ly.gov.tw/lylgmeetc/lgmeetkm"
tier = 1
covers = ["會議發言紀錄", "質詢紀錄"]
notes = "以文字查發言，再回 IVOD 對影片。"

[[source]]
id = "president-order"
name = "總統府公布法律、預決算、條約（總統令）"
url = "https://www.president.gov.tw/Page/36"
tier = 1
covers = ["法律公布日期", "總統令"]
notes = "確認法律是否已公布、何時公布。"

[[source]]
id = "gazette"
name = "行政院公報資訊網"
url = "https://gazette.nat.gov.tw/"
tier = 1
covers = ["法規命令發布", "行政規則", "公告", "預告修法"]
notes = "行政命令與公告的正式刊登處。"

[[source]]
id = "judicial-fjud"
name = "司法院裁判書查詢"
url = "https://judgment.judicial.gov.tw/FJUD/default.aspx"
tier = 1
covers = ["各級法院裁判書全文", "裁定", "判決"]
notes = "看判決全文的主文與理由，不要只看新聞標題；注意是否已上訴、是否確定。批次資料另見司法院資料開放平台 https://opendata.judicial.gov.tw/。"

[[source]]
id = "cons-court"
name = "憲法法庭"
url = "https://cons.judicial.gov.tw/"
tier = 1
covers = ["憲法法庭判決", "大法官解釋", "言詞辯論", "暫時處分"]
notes = "查判決主文、理由與各大法官意見書。"

[[source]]
id = "cec-db"
name = "中選會選舉資料庫"
url = "https://db.cec.gov.tw/"
tier = 1

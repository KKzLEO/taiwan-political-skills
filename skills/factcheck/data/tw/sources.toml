covers = ["物價指數", "國民所得與經濟成長", "薪資", "就業與失業"]
notes = "官方統計原始數據；比對時注意基期、名目或實質、季調與否。"

[[source]]
id = "moj-stat"
name = "法務部法務統計資訊網"
url = "https://www.rjsd.moj.gov.tw/rjsdweb/"
tier = 1
covers = ["犯罪與起訴統計", "矯正統計", "檢察統計"]
notes = "查犯罪率、起訴數等數字；注意統計口徑（案件數或人數）。"


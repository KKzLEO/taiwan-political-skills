covers = ["政治獻金會計報告", "競選經費收支"]
notes = "依政治獻金法公開的申報資料；申報內容屬當事人申報，不等於查核結論。"

[[source]]
id = "data-gov"
name = "政府資料開放平臺"
url = "https://data.gov.tw/"
tier = 1
covers = ["各機關開放資料集", "統計原始檔"]
notes = "下載原始資料自行計算；記下資料集名稱、提供機關與更新日期。"

[[source]]
id = "stat-gov"
name = "中華民國統計資訊網（主計總處）"
url = "https://www.stat.gov.tw/"

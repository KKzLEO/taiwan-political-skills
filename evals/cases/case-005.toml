id = "case-005"
title = "新聞報導2024政黨票：民眾黨得票率翻倍、8席不分區（開票夜票數與最終數小差）"
input_type = "url"
input = """https://newtalk.tw/news/view/2024-01-13/905127"""
target = "民眾黨"
expected_result = "符合"
notes = """網址輸入路徑測試，報導內容對民眾黨偏正面。
判定關鍵：中選會選舉資料庫（db.cec.gov.tw，下列 JSON 是同站前端讀取的原始資料）第11屆、第10屆不分區政黨票。
1. 得票率與席次全部正確：民進黨36.16%／13席、國民黨34.58%／13席、民眾黨22.07%／8席；2020年民眾黨11.22%／5席。
2. 2024年的票數是開票當晚數字，和中選會最終數字有小差：民進黨 4,984,060 對 4,982,062、國民黨 4,764,293 對 4,764,576、民眾黨 3,040,334 對 3,040,615。差距都在0.05%以內，不影響結論，所以判 mostly_true，不是 false。
3. 2020年票數和中選會一致。
4.「幾乎翻倍」：票數 1,588,806 → 3,040,615（1.91倍）、得票率 11.22% → 22.07%（1.97倍），「幾乎」用得準確，判 true。
5. 時代力量2.57%，其餘政黨更低，「僅前三大黨超過5%」成立。
「推測可能跟柯文哲參選總統的風潮有關」是記者推測，屬 not_factual。"""


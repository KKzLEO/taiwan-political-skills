[[claim.ground_truth]]
url = "https://www.mol.gov.tw/1607/1632/1633/84947/post"
excerpt = "本次調升預估約247萬名勞工受惠，其中本國勞工約208萬人。勞動部強調，本次會議結論倘經行政院核定實施，是自105年以來連續10年調漲"


id = "case-007"
title = "公視報導2026年最低工資月薪29,500元、時薪196元"
input_type = "url"
input = """https://news.pts.org.tw/article/772368"""
target = "政府機關"
expected_result = "符合"
notes = """網址輸入路徑測試，內容是政府政策的正確報導，作為「正確」的基準案例。
判定關鍵：勞動部114年9月26日新聞稿（審議會決議數字、調幅、受惠人數、連續10年調漲、陳報行政院核定），以及勞動部最低工資專區（115年1月1日起實際適用的數字，證明後來確實核定實施）。
時薪196元的調幅實際約3.16%，但勞動部寫明時薪「比照每月最低工資之調幅」，報導寫「調幅3.18%」和官方說法一致，判 true。
用詞細節：最低工資法施行後，自114年1月1日起「基本工資由最低工資取代」，報導內文仍寫「基本工資」。數字完全正確，只是沿用舊名稱，不影響結論，仍判 true；查核報告可以順帶提醒。
時間點：報導的「明年」是指2026年（115年）。2026年11月再讀這篇時，不能把它當成2027年的數字，但這篇報導本身在發布時是正確的。"""

[[claim]]
original = "勞動部今（26）日舉行最低工資審議委員會，拍板決定2026年起，基本工資月薪調到2萬9500元、時薪196元"
expected_label = "true"
core = true
importance = 5

[[claim.ground_truth]]
url = "https://www.mol.gov.tw/1607/1632/1633/84947/post"
excerpt = "最低工資審議委員會於今（26）日召開會議，經勞、資、學、政四方委員討論，決定自115年1月1日起，每月最低工資由28,590元調整至29,500元，調升910元，調幅3.18％；每小時最低工資則比照每月最低工資之調幅，由190元調整至196元。"

[[claim.ground_truth]]
url = "https://www.mol.gov.tw/topic/3067/5990/5999/14482/"
excerpt = "自114年1月1日起，基本工資由最低工資取代，依最低工資法第5條規定，勞工與雇主雙方議定之工資，不得低於最低工資；其議定之工資低於最低工資者，以本法所定之最低工資為其工資數額。115年1月1日起，每月最低工資為新臺幣（以下同）29,500元，每小時最低工資為196元。"

[[claim]]
original = "調幅3.18%"
expected_label = "true"
core = false
importance = 3

[[claim.ground_truth]]
url = "https://www.mol.gov.tw/1607/1632/1633/84947/post"
excerpt = "每月最低工資由28,590元調整至29,500元，調升910元，調幅3.18％；每小時最低工資則比照每月最低工資之調幅，由190元調整至196元。"

[[claim]]
original = "基本工資連續10年調漲，預估247萬名勞工受惠"

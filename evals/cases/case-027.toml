id = "case-027"
title = "「美國軍購清單只要3000億，民進黨卻要1.25兆，浮編9500億」：訪美、記者會、1.25兆都是真的，但3000億只是第一批，其餘不是浮編"
input_type = "text"
input = """【全網大爆炸 !!!
剩下的9500億要幹嘛？】
近日 民眾黨黃國昌一行人
行程緊湊 快閃赴往美國
該見到的人都見了
回國後 他召開記者會表示 ----
美國給我國的軍購清單
只要3000億，
執政的民進黨
卻要向立院索取 1.25兆
浮編的9500億 是要進誰口袋？

黃國昌抓出多少民進黨弊案
抓到 賴(Lie)皇 Cheater(輕德) 恨不得搞死他 ....."""
target = "民進黨"
expected_result = "不符"
found_via = "https://cofacts.tw/article/35126wyadvxoi"
notes = """細節真、主旨假（A 類）：訪美、記者會、1.25兆、3000億四個材料都有來歷，但拿「1.25兆減3000億」當成浮編、暗示有人要拿走，是錯的。訊息原文取自 Cofacts（文章 35126wyadvxoi，2026-01-14 收錄，UTC 16:25，即台灣時間1月15日凌晨，1人回報），逐字照抄，行尾空白和「賴(Lie)皇 Cheater(輕德)」的寫法都保留。同一天另有兩則同題圖卡（SNWCu5sBrQ7DCeIz9K9x、FtVru5sBrQ7DCeIzta8P），本案只用這一則。沒有找到針對這則訊息的查核報告，答案來自國防部新聞稿、立法院議案關係文書和全國法規資料庫。訊息稱讚黃國昌、攻擊「執政的民進黨」，target 取民進黨。
判定關鍵：
1. 訪美和記者會是真的：中央社2026-01-11報導黃國昌當天率團（共4人）赴華府，2026-01-14報導他清晨返台、上午在中央黨部開記者會。判 true。
2.「美國給我國的軍購清單只要3000億」判 misleading：3000億這個數字對得上的是「第一批」。國防部115年1月14日新聞稿說，特別條例草案7大類裝備中，M109A7自走砲、海馬士等5項美方已經知會國會，另有4項軍購案還在審查；同一份新聞稿直接說「所謂『對美軍購只需3000億』並非事實」。後來立法院115年5月8日三讀、5月11日公布的「保衛國家安全及強化不對稱戰力計畫採購特別條例」（藍白版本）第6條，把這5項的第一批發價書預算上限訂為3000億元，另外替第二批（美方同意後）再匡4800億元，合計7800億元，全部是對美軍購。也就是連在野黨自己通過的版本，對美軍購都不只3000億。材料是真的（第一批約3000億），拿來當成全部就誤導。黃國昌在記者會上的原話，中央社記到的是「1.25兆元不全然是對美軍購，『有相當高比例不是』」；他有沒有親口說「只要3000億」，本案沒有取得記者會完整錄影，判定針對數字本身，不針對引述。
3.「民進黨要向立院索取1.25兆」判 true：行政院114年11月27日函送立法院的「強化防衛韌性及不對稱戰力計畫採購特別條例草案」，第5條經費上限新臺幣1兆2500億元，施行到122年底（2026至2033年）。
4.「浮編的9500億是要進誰口袋」判 false，這是整則的主旨：1.25兆減3000億等於9500億的算術沒錯，但這9500億不是灌水。行政院草案總說明和第4條寫明採購7類項目，包含對外軍購、商購和國內產製（支持本土企業研發製作、新建軍備產線）；國防部說其中國內產製約3千餘億元，其餘是對外採購。「進誰口袋」是沒有根據的影射，不另外拆。
為什麼是不符：訊息最想讓讀者相信的是「美國只開了3000億的清單，多出來的9500億是浮編、有人要拿」。真的部分只有行程、記者會和兩個數字各自的來歷；把兩個數字相減當成浮編，有國防部新聞稿、草案條文和後來三讀的條文直接反證。查核時如果只核對「黃國昌有去美國、有開記者會、政院版是1.25兆」就判大致符合，會漏掉主旨。
時間處理：訊息沒有寫日期，Cofacts 收錄時間是背景資料，使用者手上沒有。「近日」是相對時間、查不到發布時間，事件本身（訪美、記者會）照內容判 true；另寫一條隱含命題「訪美和記者會是查核日期前不久的事」，依查核日期（2026-11-19）判 false，實際是2026年1月11日至14日，重要性2。「卻要向立院索取1.25兆」照事件內容判 true；今天再讀，政院版沒有通過，立法院通過的是上限7800億、只含對美軍購的版本，查核報告應補充。訊息沒有叫讀者做事，不需要另寫期限前提。
後續進度提醒：行政院依三讀條文第6條請立法院同意籌編116年度特別預算的函，立法院議案系統顯示排在2026-12-01院會（議案編號301110252960000）。這是預算程序，不會改變本案判的幾件事（1月的草案內容、3000億對應第一批、9500億不是浮編）。
「【全網大爆炸 !!! 剩下的9500億要幹嘛？】」是標題式的反問，「黃國昌抓出多少民進黨弊案…恨不得搞死他」是評價，都屬 not_factual。
摘錄說明：行政院草案 PDF 摘錄取自單欄排版的總說明，只去掉排版造成的換行和空白；法規沿革摘錄把換行和連續空白壓成一格。議案關係文書網址直接開啟可能被轉回議事網首頁，要帶瀏覽器標頭和 referer 下載。
複核說明（2026-11-19）：兩位獨立複核員重新查證後都判「不符」，七條命題的標籤也都和原答案相同；裁定者把8個來源重新下載、15筆摘錄逐筆比對，文字都找得到（3筆要去掉換行才對得上）。預期結果和標籤不改，只修證據和備註；下面和前文不一致的地方，以這一段為準。
（一）證據改了什麼：
1.「近日」那條：原本第一筆摘錄沒有日期，第二筆是另一篇報導（國防部回應那篇）的稿末日期戳。現在保留出發那一句，補同一頁的稿末日期戳「（編輯：林淑媛）1150111」（民國115年1月11日），第二筆換成記者會那篇的圖說「…結束訪美行程，14日在中央黨部舉行記者會…115年1月14日」。
2. 法規沿革摘錄：原頁「號令」後面是換行再接「制定」，照「換行和連續空白壓成一格」應該是「號令 制定」，原摘錄少一格，已補上。
3.「浮編的9500億」那條補上去向：9500億＝第二批對美軍購上限4800億（三讀條文第6條）＋沒進條例的13個商購、委製案項4700億（國防部主計局長2026-08-20的說明，中央社 202608200184）。國防部2026-04-21公開機密專報的非機密內容，七類金額是810、1600、3350、5500、100、500、640億，合計正好1.25兆（中央社 202604210134；2026-01-19已先公開各類數量，中央社 202601190177）。
4.「只要3000億」那條補上黃國昌本人的說法和查核日的現況（見下面第3、4點）。
（二）備註更正：
1. 行尾空白沒有保留：Cofacts 原文有三處行尾各一個空白（「該見到的人都見了」「執政的民進黨」「黃國昌抓出多少民進黨弊案」後面），input 都去掉了，其餘逐字相同，不影響判定。兩則同題圖卡的「同一天」是照 UTC 算，換成台灣時間是1月14日下午。
2. 有查核報告：台灣事實查核中心第3999號〈網傳「1.25兆特別預算，只有3000億是軍購」？〉（2026-01-29發布、02-04更新，https://tfc-taiwan.org.tw/fact-check-reports/misleading-taiwan-us-arms-purchase-only-300-billion/ ）判「錯誤」，查的是同一個傳言，但沒有處理「浮編9500億、進誰口袋」這一句；Cofacts 文章 30djrntcwtacx 也有一則判不實的回應。方向和本案一致，答案仍然照第一手資料判，查核機構的結論只當線索。
3. 黃國昌的原話查得到，訊息把話說得比他本人重：自由時報2026-01-15引他說「到目前為止…美國國務院已經公告對美直接採購的金額是3000億元多一點」（https://news.ltn.com.tw/news/Taipei/breakingnews/5311036 ）；查核中心記載他在記者會說美方「還會有進一步通知的項目」，民眾黨隔天也說「只有3000億」是錯誤報導。一支上傳者自附字幕的記者會精華影片（https://youtu.be/bq8haBokdnA ，2026-01-14上傳，約44分鐘，不是完整錄影；圖卡 FtVru5sBrQ7DCeIzta8P 引用的就是它）03:39–04:19、05:59–06:52、40:14–40:36 的字幕也是這樣：美方公布的5項「大概是3,000億台幣左右」「還會有進一步通知的項目」，其餘的錢要做什麼「我也不知道」「可能有一些軍火商的掮客知道」。他沒有說「只要3000億」，也沒有說「浮編9500億」「進誰口袋」。完整直播錄影有（民眾之聲 https://www.youtube.com/watch?v=suZjwWfGi3s 、民視 https://www.youtube.com/watch?v=5wxfFulawLo ），都沒有字幕，這次沒有逐字聽。判定照內容判，標籤不變。
4. 到查核日，美方正式同意的仍只有第一批：行政院115年11月9日函寫第一批上限3,000億元「已獲美國政府同意售予6項軍購案」，115年度特別預算實際編列88億1,057萬1,000元、116年度要編102億1,969萬1,000元；第二批（約140億美元）到11月中仍待川普政府批准（中央社 202611140062）。所以前文「連在野黨自己通過的版本，對美軍購都不只3000億」要補一句：4800億是美方同意後才能編的授權上限，到查核日還沒成立（條例第5條第1項第6款要求美方在施行後一年內同意）。查核報告如實寫出「到今天美方正式同意的只有第一批、約3000億」不算錯；判誤導是因為訊息把第一批當成全部，再推出「其餘是浮編」。
5. 沒進條例的案項後來另外處理：行政院版《國防自主無人載具採購特別條例》沒有通過（國防部115年8月27日新聞稿），立法院通過的是在野版《強化國防自主暨無人載具產業發展條例》（115年9月11日公布，走年度預算，連續六年、總額2400億元）；強弓飛彈等其餘案項，國防部2026-08-20說要放進追加預算。美國國務院2026-02-04也公開說歡迎這筆400億美元（約1.25兆）的特別預算。這些都說明其餘的錢有具體用途。
6. 議程：行政院那份函（議案301110252960000）排在第11屆第6會期第8次會議，議案系統列的日期是115年11月20日和12月1日，不是只有12月1日。
7. 議案關係文書 PDF 帶瀏覽器標頭（User-Agent）就能下載，不帶會回403，不需要 referer。
8. 原本列在這裡的下載檔清單已經刪掉（那些檔案不在專案裡）；8個來源已在2026-11-19重新下載核對。
（三）相鄰一級：「部分符合」勉強講得通（把那句反問當成不計分的意見，剩下3000億誤導、1.25兆正確；而且到查核日美方正式同意的確實只有第一批），但標題和結尾都落在「浮編、進誰口袋」，照「主旨是錯的或誤導的，即使有些細節正確」判不符。
（四）穩定性：風險低。第二批對美軍售如果在未來幾週核准，「3000億只是第一批」更明確；萬一正式擱置，「只要3000億」會更接近字面，但條例規定沒有美方同意就不能編預算，「浮編9500億進口袋」仍然是錯的。11月20日、12月1日的院會只是預算程序。
相鄰的另一級也講得通：另一級「部分符合」勉強講得通，兩位複核員和我都不採用。講得通的理由：如果把「浮編的9500億 是要進誰口袋？」當成不計分的反問，剩下最重要的兩個數字一個誤導（3000億）、一個正確（1.25兆）；而且到查核日（2026-11-19）美方正式同意的確實只有第一批、約3000億，第二批約140億美元還沒核准，有人會讀成「政府要的錢遠超過美方已公布的清單」這一半有來歷。不採用的理由：訊息的標題（剩下的9500億要幹嘛）和結尾（浮編的9500億是要進誰口袋）都落在「多出來的錢是灌水、有人要拿」，這才是主旨，而它有直接反證（9500億＝第二批對美軍購上限4800億＋13個商購、委製案項4700億，七類金額也公開過）。照定義文字「主旨是錯的或誤導的，即使有些細節正確」，是不符，寫法也和 case-021、case-022 一致。命題層級的相鄰選項：「只要3000億」有人會判 false（國防部說並非事實、查核中心判錯誤），「浮編9500億」有人會判 misleading，兩者都不改變整則結果。"""


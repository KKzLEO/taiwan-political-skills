id = "case-036"
title = "「民生電價喊漲在即，張啟楷譏陳建仁要當漲電費的院長」：質詢和台電虧損都是真的，但這是2024年2月的事，引號裡的話是改寫"
input_type = "text"
input = """台電的虧損要人來補嗎？

   民生電價喊漲在即，除了直接的電費提高，也勢必導致物價上漲，形同剝人民多層皮，然而台電連年虧損到需要政府拿納稅錢補貼，補貼等同於用全民的錢去補用電大戶。

   張啟楷狠譏，行政院長陳建仁要成為一個「剝削人民、漲電費的院長」？

   台電應該積極改革現行的電力成本結構，重新審視各種合約、調整目前的購電策略，而不是只會向政府和人民伸手。

https://vt.tiktok.com/ZSFDLTY1H/"""
target = "民眾黨"
expected_result = "大致符合"
found_via = "https://cofacts.tw/article/33ldr3bz1zxek"
notes = """舊聞新傳（E 類）：沒有日期的轉傳文字，用「喊漲在即」把兩年多前的質詢說成眼前的事，內容本身大致正確。訊息原文取自 Cofacts（文章 33ldr3bz1zxek，2024-03-04 收錄，UTC 22:26，即台灣時間3月5日06:26，1人回報），是一支抖音短片的說明文字，逐字照抄，每段開頭的空白和結尾的連結都保留；「張啟楷」是原文寫法，立法院紀錄寫「張啓楷」。連結的抖音影片沒有取得，本案只查文字。我沒有另外搜尋查核機構的報告，Cofacts 上也沒有回覆；答案來自立法院公報的質詢紀錄和中央社當時的報導。訊息轉述、稱讚民眾黨立委張啓楷對電價的質詢，target 取民眾黨。
判定關鍵（立法院第11屆第1會期第2次會議，2024年2月27日施政質詢，張啓楷質詢行政院長陳建仁，IVOD 149148，11:13–11:45；文字取自 ly.govapi.tw 鏡像回傳的公報逐字稿）：
1.「張啟楷狠譏，行政院長陳建仁要成為一個「剝削人民、漲電費的院長」？」判 mostly_true：質詢確有其事，意思也對，但引號裡不是原話。公報記下的原話是「你會不會擔心溫暖的大仁哥變成是一位漲價的院長？這會不會是你最後的歷史定位？」「台電現在這個虧損要人民來補嗎？要剝人民幾層皮呢？」以及後段的「你會變成「漲價院長」」。訊息把「漲價的院長」和「剝人民幾層皮」兩句合成「剝削人民、漲電費的院長」，放進引號。陳建仁當場回答「我想我不會是漲價的院長」。當時的行政院長確實是陳建仁。這是整則的主旨（張啓楷在國會批評電價調漲），重要性5。如果因為引號內不是逐字原話就判 misleading 或 false，是判太重：說話的人、對象、場合和意思都對得上。
2.「民生電價喊漲在即」照事件內容判 true：質詢當天陳建仁答「我們確實是在評估當中」；中央社2024-03-22報導，經濟部電價費率審議會當天決議平均電價調漲約11%，住宅調漲4.5%，4月1日開始實施。所以訊息流傳時（2024年3月初）電價確實正要漲。
3.「台電連年虧損到需要政府拿納稅錢補貼」判 true：同一場質詢陳建仁說「台電有滿大的虧損，有三千多億的虧損」，經濟部長王美花說「確實台電這樣的虧損還是需要政府財源的挹注啦」；中央社同一篇報導，審議會是「在政府補助1000億元前提下」做成決議。台電歷年決算沒有另外下載（台電和經濟部網站擋自動抓取），「連年」以院長和部長在國會的說法為證據。
4.「訊息暗示的時間」判 false：訊息沒有日期，「喊漲在即」「行政院長陳建仁要成為…」讀起來像現在的事。實際上質詢是2024年2月27日，那一波電價已經在2024年4月1日調漲；陳建仁在同一場質詢自己說做到520（「就是講好到520，陪他一起同進退」），早已不是行政院長。這條依查核日期（2026-11-19）判 false，重要性3。
為什麼是大致符合：訊息要讀者知道的是「民眾黨立委張啓楷在國會批評電價要漲、台電虧損卻要人民和政府買單」，這件事正確；錯的是時間（兩年多前的事說成眼前的事）和引號裡的用字，都屬於不影響這個主旨的細節。依時間規則，舊消息說成新消息、內容本身正確，預期最高「大致符合」；這一類答案卷本來就有一級雜訊，判「部分符合」算可接受的鄰近答案。因為語氣是攻擊政府就判不符，或沒注意到時間和引號就判符合，都差了一級。
「台電的虧損要人來補嗎？」是標題式的反問；「除了直接的電費提高，也勢必導致物價上漲，形同剝人民多層皮」是預測和評價；「補貼等同於用全民的錢去補用電大戶」是推論式的評價（撥補台電的錢讓所有用戶的電價都低於成本，用電多的受益多，但說成「等同於補大戶」是立場）；「台電應該積極改革…而不是只會向政府和人民伸手」是主張，和張啓楷在質詢裡的立場一致（「要不要先去把台電買電這個事情弄清楚才去談漲價的事情」）。這四段都屬 not_factual。
時間處理：使用者今天（2026-11-19）收到訊息、今天要求查核；沒有日期的轉傳文字算查不到發布時間，Cofacts 收錄時間不算發布時間。「喊漲在即」是相對時間、查不到發布時間，事件本身（那一波電價調漲、那一場質詢）照內容判，不寫日期；另寫一條隱含命題「這次質詢和這一波電價喊漲是查核日期前不久的事」，錨在「民生電價喊漲在即」，依查核日期判 false。時間的錯只記在這一條，不因此把質詢或台電虧損判成誤導。訊息沒有叫讀者在期限前做事，不需要另寫期限前提。
後續進度提醒：今天碰巧又有電價議題。經濟部2026年9月18日的電價費率審議會決議這次電價調整「暫不決定」，並支持爭取政府撥補711億元，媒體報導要留到12月的審議會再議（今周刊2026-09-18報導；12月的結論今天還不知道）。這不會改變本案判的幾件事：訊息講的是陳建仁當行政院長時的那一場質詢和2024年4月那一次調漲，時間命題判的是「這場質詢是不是最近的事」。流程如果因為2026年底又在談電價，就把「喊漲在即」當成現在也成立而不另外指出這是2024年的舊訊息，整體會落在「符合」，差一級。
摘錄說明：公報逐字稿取自 ly.govapi.tw（立法院開放資料的鏡像）回傳的原始 JSON，摘錄逐字取自其中的 blocks；官方 IVOD 頁面（https://ivod.ly.gov.tw/Play/Clip/1M/149148）是影片，沒有文字。中央社摘錄取自網頁內文。
公式估算：(5×0.75＋3×1＋3×1＋3×0)/14 ≈ 70，大致符合，與人工判定一致。

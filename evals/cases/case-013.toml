id = "case-013"
title = "「核三公投一定要過488萬7133票」：8/23公投已經投完，門檻數字也用錯了選舉人數"
input_type = "text"
input = """8/23日公投核能發電，一定要出去投同意，因為一定要達到488萬7133票以上，才能啟動，執政者不願宣傳，是怕通過，有很多人不知道8/23要出去投票，請轉傳給親朋好友們，鼓勵大家去投同意票"""
target = "民進黨"
expected_result = "不符"
found_via = "https://cofacts.tw/article/2d3khzvhzr5a8"
notes = """答案以使用者收到訊息的那一天為準（2026-11-19 決定）：使用者是今天收到這則訊息、今天問它對不對，所以「8/23要去投同意」要用今天的時間判斷。公投在2025-08-23已經投完，也沒有通過，訊息要讀者做的事已經不可能做到。第一版答案以訊息收錄當時（公投前一天）為準，預期是「大致符合」，理由保留在下方第4點。
訊息原文取自 Cofacts（文章 2d3khzvhzr5a8，2025-08-22 收錄，9人回報，公投前一天），逐字照抄。同樣的「488萬7133票」2026年8月又被轉傳（Cofacts ew0zvhs12f0b，文字略有不同），本案只用2025年版本。沒有找到針對這則訊息的查核報告，答案全部來自中選會和全國法規資料庫。
判定關鍵：
1. 8/23確實有核電公投：中選會「114年全國性公民投票案第21案投開票結果表」，投票日期114年08月23日，主文是第三核能發電廠經主管機關同意確認無安全疑慮後繼續運轉。訊息說「公投核能發電」是簡化說法，主體正確，判 true。
2. 門檻數字錯：公投法第29條要求有效同意票多於不同意票，且達投票權人總額四分之一。第21案投票權人數20,002,091人，四分之一是5,000,522.75，同意票至少要5,000,523票，比訊息的4,887,133多113,390票。訊息的數字正好是2024年總統選舉選舉人數19,548,531的四分之一（4,887,132.75）：總統選舉依總統副總統選舉罷免法第11條要年滿20歲，公投依公投法第7條年滿18歲就有投票權，所以用錯了母數。數字有直接反證，判 false。
3.「才能啟動」也說過頭：公投通過後依公投法第30條第1項第3款，是由總統或權責機關為實現公投內容做必要處置；主文本身也以主管機關確認無安全疑慮為前提，不是一過門檻就啟動。這點併入第2條命題的理由，不另外拆。
4. 為什麼是不符：訊息的主旨是「8/23要出去投同意」，它要讀者相信這場公投還沒舉行、還可以去投，這在今天是錯的（中選會結果表：投票日期114年08月23日，同意票4,341,432，未達門檻，不通過）。真的部分只剩「有過這場核電公投」，門檻數字也錯。如果以訊息收錄當時為準，主旨（去投同意）和根據的事實（有核電公投、要過四分之一門檻）都對，錯的只是門檻的具體數字（差約2.3%），會是「大致符合」。
「一定要出去投同意」是呼籲，「執政者不願宣傳，是怕通過」是動機揣測，都屬 not_factual。最後一句「有很多人不知道8/23要出去投票，請轉傳給親朋好友們，鼓勵大家去投同意票」的呼籲部分也是 not_factual，但它預設這場公投還沒舉行，答案卷把這個隱含命題錨在這一句，判 false。
比對注意：eval-compare 依原文相似度配對。流程如果把「公投還沒舉行」錨在別句，或把最後一句拆成呼籲加模糊說法，這條可能配不到或配錯，命題分數要回到 claims.json 人工確認；結果是否「不符」不受影響。中選會公投專區另有「114年意見發表會」和公報頁面，本案沒有逐場查證，所以不把「不願宣傳」當成事實命題計分。
target：訊息攻擊「執政者」，也就是當時執政的民進黨政府，target 取民進黨。
摘錄說明：中選會結果表的表格列照 pdftotext 的欄位順序抄錄，欄位依序是投票權人數、同意票數、同意百分比、不同意票數、不同意百分比、有效票數、無效票數、投票人數、投票率、有效同意票數對投票權人數百分比，最後的 V 打在「不通過」欄。2024年總統選舉的選舉人數取自中選會選舉資料庫「第16任總統副總統選舉」（2024/01/13）的原始資料（votable_population）。
公式估算：(4×1＋3×0＋5×0)/12 ≈ 33，不符，與人工判定一致。"""


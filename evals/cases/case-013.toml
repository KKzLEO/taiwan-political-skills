id = "case-013"
title = "「核三公投一定要過488萬7133票」：8/23公投是真的，門檻數字用錯了選舉人數"
input_type = "text"
input = """8/23日公投核能發電，一定要出去投同意，因為一定要達到488萬7133票以上，才能啟動，執政者不願宣傳，是怕通過，有很多人不知道8/23要出去投票，請轉傳給親朋好友們，鼓勵大家去投同意票"""
target = "民進黨"
expected_result = "大致符合"
found_via = "https://cofacts.tw/article/2d3khzvhzr5a8"
notes = """主旨真、細節錯：門檻數字錯。訊息原文取自 Cofacts（文章 2d3khzvhzr5a8，2025-08-22 收錄，9人回報，公投前一天），逐字照抄。同樣的「488萬7133票」2026年8月又被轉傳（Cofacts ew0zvhs12f0b，文字略有不同），本案只用2025年版本。沒有找到針對這則訊息的查核報告，答案全部來自中選會和全國法規資料庫。
判定關鍵：
1. 8/23確實有核電公投：中選會「114年全國性公民投票案第21案投開票結果表」，投票日期114年08月23日，主文是第三核能發電廠經主管機關同意確認無安全疑慮後繼續運轉。訊息說「公投核能發電」是簡化說法，主體正確，判 true。
2. 門檻數字錯：公投法第29條要求有效同意票多於不同意票，且達投票權人總額四分之一。第21案投票權人數20,002,091人，四分之一是5,000,522.75，同意票至少要5,000,523票，比訊息的4,887,133多113,390票。訊息的數字正好是2024年總統選舉選舉人數19,548,531的四分之一（4,887,132.75）：總統選舉依總統副總統選舉罷免法第11條要年滿20歲，公投依公投法第7條年滿18歲就有投票權，所以用錯了母數。數字有直接反證，判 false。
3.「才能啟動」也說過頭：公投通過後依公投法第30條第1項第3款，是由總統或權責機關為實現公投內容做必要處置；主文本身也以主管機關確認無安全疑慮為前提，不是一過門檻就啟動。這點併入第2條命題的理由，不另外拆。
為什麼是大致符合：訊息要讀者做的事（8/23去投同意）和它根據的事實（有核電公投、同意票要過四分之一門檻才通過）都對；錯的是門檻的具體數字，差約2.3%。實際同意票4,341,432票，比兩個數字都低，這個錯不影響結論，所以是細節錯，不是「部分符合」。
「一定要出去投同意」「有很多人不知道8/23要出去投票，請轉傳給親朋好友們，鼓勵大家去投同意票」是呼籲，「執政者不願宣傳，是怕通過」是動機揣測，都屬 not_factual。中選會公投專區另有「114年意見發表會」和公報頁面，本案沒有逐場查證，所以不把「不願宣傳」當成事實命題計分。
target：訊息攻擊「執政者」，也就是當時執政的民進黨政府，target 取民進黨。
摘錄說明：中選會結果表的表格列照 pdftotext 的欄位順序抄錄，欄位依序是投票權人數、同意票數、同意百分比、不同意票數、不同意百分比、有效票數、無效票數、投票人數、投票率、有效同意票數對投票權人數百分比，最後的 V 打在「不通過」欄。2024年總統選舉的選舉人數取自中選會選舉資料庫「第16任總統副總統選舉」（2024/01/13）的原始資料（votable_population）。
公式估算：(5×1＋3×0)/8 ≈ 63，大致符合，與人工判定一致。"""


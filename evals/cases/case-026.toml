id = "case-026"
title = "傅崐萁轉貼「總預算刪2075億創新高，仍比去年多2.56%」：數字都對得上議事錄，賴清德說法有公視轉述"
input_type = "text"
input = """刊載者：傅崐萁委員 刊載日期：2025/01/22
立法院昨天三讀通過一一四年中央政府總預算案，歲出兩兆九二四八億元，較原編列的三兆一三二五億元，刪除百分之六點六、約二○七五億元。歲出刪減金額雖創史上新高，但仍比一一三年中央政府總預算增加百分之二點五六。

賴清德總統昨表示，歲出預算刪減對政府的影響史無前例，完全無法接受，會請行政院盡速盤點窒礙難行之處，以及可能停擺的服務，向全體國人報告。至於是否向立法院提覆議，行政院官員表示「這是選項之一」。"""
target = "國民黨"
expected_result = "符合"
notes = """正確的基準案例：轉貼的新聞稿，數字都能在立法院議事錄算出來。訊息原文取自 Cofacts（文章 rrtza59p1q2h，2025-04-22 收錄，1人回報），逐字照抄，開頭的「刊載者：傅崐萁委員 刊載日期：2025/01/22」是原文的一部分，保留。內容是報紙新聞稿的寫法，刊在國民黨團總召傅崐萁名下，重點放在「刪減雖創新高，但仍比前一年多2.56%」，替藍白的刪減辯護，target 取國民黨。沒有找到針對這則訊息的查核報告，答案來自立法院議事錄和行政院新聞稿，賴清德的說法用公視報導。
判定關鍵（立法院第11屆第2會期第18次會議議事錄，114年1月17日、20日、21日）：
1.「昨天三讀通過」判 true：三讀決議和全案記名表決（出席97人、54比43）都在這次會議；會議從1月20日延長開會到1月21日下午3時26分，公視報導寫「21日…以贊成54人、反對43人通過三讀」。
2. 數字判 true：議事錄三讀決議寫原列歲出3兆1,324億6,890萬9千元（訊息「三兆一三二五億元」是四捨五入），減列1,135億9,925萬9千元，另外通案統刪不低於939億7,500萬元，合計2,075億7,425萬9千元，占原列歲出6.63%；相減後歲出為2兆9,248億9,465萬元左右，訊息「兩兆九二四八億元」是無條件捨去。公視報導的數字相同（刪2075億7425萬9000元、6.64%、歲出2兆9248億9555萬，和議事錄相減差約90萬元，不影響）。議事錄沒有直接寫出刪減後的歲出總額（行政院後來在覆議時也指出這一點），所以這個數字是用議事錄的原列數和減列數算出來的。
3.「仍比一一三年中央政府總預算增加百分之二點五六」判 true：113年度總預算三讀時歲出暫改列為2兆8,518億5,587萬4千元（第10屆第8會期第12次會議議事錄），2兆9,248.9億 ÷ 2兆8,518.6億 ≈ 1.0256。行政院1月23日新聞稿說原編列3兆1,325億「較去年增加2,806億元」，也就是113年度約2兆8,519億，兩個來源一致。
4.「歲出刪減金額雖創史上新高」判 true：113年度只減列299億2,622萬1千元（同上議事錄）；行政院1月20日新聞稿說過去十多年國會刪減幅度多在1.1%至1.3%，1月23日新聞稿說近3年平均刪減291億元。我沒有找到逐年列出歷來刪減數的官方表格，但以過去十多年1%左右、300億上下的水準，2,075億是數倍以上，判 true。
5.「賴清德總統昨表示，歲出預算刪減對政府的影響史無前例，完全無法接受」判 true：公視報導賴清德21日晚間發文，「對政府的影響是史無前例，完全無法接受」。原始臉書貼文沒有取得，以公視轉述為證據。
6.「會請行政院盡速盤點窒礙難行之處，以及可能停擺的服務，向全體國人報告」判 unverified：公視等報導只引述到「完全無法接受」，沒有找到這一段的出處。
7.「行政院官員表示『這是選項之一』」判 unverified：匿名官員的說法，沒有第一手紀錄。行政院1月23日新聞稿說會「依照憲政機制及程序提出最後必要的救濟」，2月27日也真的提了覆議，方向一致，但不能證明有官員講過這句話。
時間處理：訊息自己寫了「刊載日期：2025/01/22」，所以「昨天」「昨表示」依發布時間換成2025年1月21日，照這個日期判斷，兩處都對。今天（2026-11-19）再讀，114年度總預算早已執行完畢，這些都是已經發生的事，判定不變；之後的覆議被否決、追加預算等發展不影響這則訊息的正確性。訊息沒有叫讀者在期限前做任何事，不需要另寫時間前提。
為什麼是符合：訊息裡可以查證的數字和事件（三讀日期、原列與刪減金額、比例、比前一年增加2.56%、刪減創新高、總統的反應）都有第一手證據或可靠轉述，沒有錯誤；查不到的兩句都是轉述官員說法的次要細節。這則訊息站在藍營立場挑選重點（強調「仍比去年增加」），但挑選角度不是事實錯誤，不能因此降分。
摘錄說明：議事錄 PDF 摘錄只去掉排版造成的換行和空白。議事錄網址直接開啟會被轉回議事網首頁，要帶瀏覽器標頭和 referer，或從會議頁面點「本次會議議事錄」下載。"""


id = "case-035"
title = "「輝達留在北士科跟北市府沒有關係，是張忠謀、施振榮勸吳東亮才讓步」：解約和簽約的另一方都是北市府；輝達找經濟部、新壽動土是真的，科技大老勸說查不到"
input_type = "text"
input = """***請大家幫忙轉傳***
輝達會留在北士科不是蔣萬安功勞！輝達跟北市府沒有關係！

北市府搞了三個月沒有結果，後來輝達向中央政府求助，新光人壽也舉行動土典禮，工寮蓋好還請人來舞龍舞獅，每個電視台都有報導。

最後是台積電的張忠謀跟宏基電腦的施振榮去勸說吳東亮新光人壽才讓步哪有蔣萬安的功勞！無能又騙人的傢伙！請廣傳拆穿藍營的謠言！😡"""
target = "國民黨"
expected_result = "不符"
found_via = "https://cofacts.tw/article/171mwxtgev8uf"
notes = """主要說法有直接反證，次要說法查不到（D 類）。訊息原文取自 Cofacts（文章 171mwxtgev8uf，2026-10-29 收錄，UTC 05:06，即台灣時間當天13:06，12人回報，台北市長選舉前一個月），逐字照抄，開頭的星號、「宏基電腦」（應為宏碁）和結尾的表情符號都保留。Cofacts 上有一則標為「含有不實訊息」的回覆，整理了時間表並列出中央社和民報的連結，只當線索。我沒有另外搜尋查核機構的報告。答案來自中央社的逐日報導和2026-02-11的大事記（內容是北市府、新壽、經濟部各自公開宣布的事），以及民報那篇匿名消息的報導。訊息攻擊國民黨籍的台北市長蔣萬安和「藍營」，target 取國民黨。
判定關鍵：
1.「輝達跟北市府沒有關係！」判 false，這是整則的事實核心：北士科T17、T18是台北市有地，新光人壽2021年向北市府取得地上權。輝達要進駐，法律上要走的兩步，另一方都是台北市政府。第一步，2025年11月21日新壽董事會通過和北市府合意解約，北市府發新聞稿說雙方當天簽署合意解約協議（中央社2025-11-21）；解約案在11月12日先送台北市議會備查。第二步，2026年2月11日北市府宣布和台灣輝達經典股份有限公司簽訂T1718基地的專案設定地上權契約，立契約書人是市長蔣萬安和輝達代表人胡斯，權利金122億元（中央社2026-02-11大事記）。「合意解約、再由市府專案設定地上權給輝達」這個做法，是北市府2025年7月10日就提出的，9月30日並修正發布了設定地上權辦法。北市府的新聞稿原文我沒有另外下載，以中央社的引述為證據。
2.「北市府搞了三個月沒有結果」判 mostly_true：2025年7月到10月初確實沒談成。7月10日市府提出解約方案，8月22日市府說新壽不願解約、要自己和輝達談，9月30日新壽和輝達的備忘錄到期，10月7日輝達轉向經濟部。這一段作為過程描述大致屬實；但市府這段期間不是沒有作為，而且事情最後是照市府提的路徑完成的。
3.「後來輝達向中央政府求助」判 true：中央社2025-10-08報導，經濟部表示前一天接到輝達委託代表的信函，請經濟部盤點包含台北市在內、符合需求的土地。這是請中央找替代用地，不是由中央接手處理新壽和北市府的契約。
4.「新光人壽也舉行動土典禮，工寮蓋好還請人來舞龍舞獅，每個電視台都有報導」判 mostly_true：新壽2025年10月16日舉行開工動土典禮，中央社照片圖說寫新壽董事長魏寶生等人「與舞獅合影」。「工寮蓋好」「每個電視台都有報導」沒有逐一查證，屬於不影響結論的形容。
5.「最後是台積電的張忠謀跟宏基電腦的施振榮去勸說吳東亮新光人壽才讓步」判 unverified：這個說法的來源是民報2025-10-30的報導，寫「本報調查」科技業大老向台新新光金董事長吳東亮力勸，沒有具名消息來源，也沒有張忠謀、施振榮、吳東亮任何一人出面證實或否認。新壽自己在10月22日記者會的說法是董事會決議「主動化解僵局」，在北市府返還已支付成本的前提下合意解約。查不到證據，也沒有直接反證。即使這件事是真的，它解釋的是新壽為什麼願意解約，不能推出「跟北市府沒有關係」。
為什麼是不符：訊息最想讓讀者相信的是「輝達留在北士科跟北市府無關，蔣萬安什麼都沒做」。能查證的事實核心（北市府和這件事沒有關係）有直接反證：解約的對象是北市府，和輝達簽約的也是北市府。真的部分是過程中的幾件事（談了幾個月沒結果、輝達找過經濟部、新壽辦過動土典禮），這些正好讓後面的結論聽起來可信；最關鍵的「科技大老勸說」只有一篇匿名消息的報導，查不到。「是不是蔣萬安的功勞」是評價，各方（輝達、新壽、中央、市府）都有角色，答案卷不判功勞歸誰，只判「沒有關係」這個事實說法。查核時如果因為幾個細節是真的就判部分符合，或把查不到的「大老勸說」當成已證實，都偏離了；反過來把整則每一句都判錯也不對。
「輝達會留在北士科不是蔣萬安功勞！」「哪有蔣萬安的功勞！無能又騙人的傢伙！」是評價和辱罵，「***請大家幫忙轉傳***」「請廣傳拆穿藍營的謠言！」是呼籲，都屬 not_factual。
時間處理：使用者今天（2026-11-19）收到訊息、今天要求查核；沒有日期的轉傳文字算查不到發布時間，Cofacts 收錄時間不算發布時間。訊息沒有「剛剛」「最新」這類相對時間，「後來」「最後」講的是事件先後，不另寫時間命題；也沒有叫讀者在期限前做事。講的是2025年7月到2026年2月的事，照事件內容判，今天再讀判定不變。
後續進度提醒：台北市長選舉在2026年11月28日，這則訊息是選前流傳的攻擊文。本案判的幾件事（2025年11月解約、2026年2月簽約、誰是契約當事人）都是已經完成的法律行為，選舉結果不會改變。開工進度（市府原先希望2026年6月動工）沒有查，不在訊息範圍內。
摘錄說明：中央社摘錄取自網頁內文；大事記每一條是一段，照原樣抄。民報摘錄取自內文。
公式估算：(5×0＋3×0.75＋3×1＋2×0.75＋4×0.35)/17 ≈ 48，部分符合；人工判定「不符」，因為訊息的事實核心有直接反證，真的部分只是鋪陳。
下載檔（dl/）：cna_202602110209.html、cna_202511210288.html、cna_202510220283.html、cna_202510160175.html、cna_202510080320.html、peoplenews_2861.html、cofacts_171mwxtgev8uf.json。
複核（2026-11-20）：查了什麼：用 Cofacts API 重抓文章 171mwxtgev8uf，原文和 input 逐字相同（2026-10-29T05:06Z 收錄、12人回報，唯一的回覆標為含有不實訊息）。重新下載中央社 202602110209（大事記，2026-02-11 15:54 發布）、202511210288、202510080320、202510160175、202510220283 和民報 2861（2025-10-30），原有摘錄都逐字找得到，也支持原判定。北市府是2021年地上權契約、2025年11月合意解約、2026年2月新地上權契約這三份文件的當事方，「輝達跟北市府沒有關係」維持 false。
後續發展查到今天：沒有找到張忠謀、施振榮、吳東亮任何一人出面證實或否認「大老勸說」。新找到鉅亨網2025-11-07報導，台新新光金總經理林維俊被問到這個傳聞時說「並不知道這件事」；這是當事公司高層沒有證實，不是直接反證，所以維持 unverified，把這段加進第5條的證據。自由時報2026-11-05報導，前政務委員張景森在選前批評蔣萬安、李四川把輝達列為政績，說「真正該感謝的是新壽吳東亮董事長」；但他描述的過程同樣是「10月市府堅持新壽必須先解約，再由市府重新設定地上權」，也就是連批評市府的一方都把市府當成這件事的當事方。他談的是功勞歸誰，屬於評價，不影響第3條；他也沒有提到張忠謀、施振榮。沒有查到2026年2月簽約後地上權契約被解除或改約的消息。
改了什麼：標籤和整則結論都不改，只在第5條新增鉅亨網一筆證據，原有證據全部保留。查核日期以2026-11-20計算，判定和原稿相同。
相鄰的「部分符合」也講得通：如果把「輝達跟北市府沒有關係」當成「功勞不在北市府」的誇張說法（評價），剩下能查證的是三條大致屬實（談了幾個月沒結果、輝達找經濟部、新壽辦動土）加上一條查不到（大老勸說），整則可能落在部分符合。但這句字面上是事實說法，而且有解約和簽約文件可以直接反證，所以以「不符」為準。
未來幾週可能的變化：台北市長選舉在2026年11月28日。選戰期間如果張忠謀、施振榮或吳東亮出面證實勸說，第5條會改成 true 或 mostly_true，但北市府是解約和簽約的另一方這件事不會變，整則仍是不符。輝達總部何時依法開工不在訊息範圍內。複核下載檔放在 .work/keys/work/case-035-戊/dl/：上面六篇中央社和民報網頁、cofacts_171mwxtgev8uf.json、cnyes_6224134.html、ltn_5630558.html。

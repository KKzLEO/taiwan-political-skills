id = "case-004"
title = "「韓國瑜說礦工的兒子憑什麼當副總統」：剪掉前提、加上「憑什麼」"
input_type = "text"
input = """韓國瑜昨晚造勢晚會上說，賴清德是礦工的兒子「憑什麼當副總統，憑什麼出來選總統」。
國民黨看不起礦工的兒子！
（附影片20秒）"""
target = "國民黨"
expected_result = "不符"
found_via = "https://tfc-taiwan.org.tw/fact-check-reports/migration-10145/"
notes = """引述錯置案例：公眾人物說過相關的話，但前後文被剪掉，還被加上原話沒有的字。2024年1月8日起流傳，原始場合是1月6日侯康桃園造勢。
判定關鍵：完整影片。我自己下載兩支獨立拍攝的影片，用 whisper 轉寫後人工校對：
1. ETtoday 新聞雲〈韓國瑜挺侯康！批賴清德沒資格選〉（2024-01-06，5分32秒）：韓國瑜先批評賴清德說中華民國憲法是災難，接著說「沒有中華民國的保護，沒有政府的照顧，一個礦工的小孩，怎麼能當上中華民國的副總統」。全段沒有「憑什麼」。
2. 三立新聞台〈一刀未剪〉（2024-01-06，8分03秒）：影片開頭0:00–0:34是頻道剪的精華預告，「一個礦工的小孩」在0:14，和查核中心說網傳影片擷取自0:14–0:34一致，代表網傳版本正好從前提句之後開始剪；完整談話在2:17之後，同樣有「沒有中華民國的保護，沒有政府的照顧」。全片8分鐘轉寫都沒有「憑什麼」。（whisper 把「賴清德」聽成「愛情的」，摘錄已校正。）
所以「礦工的小孩」「副總統」「選總統」這些材料是真的，但他的論點是「沒有中華民國的照顧就不可能」，不是看不起出身；「憑什麼」是傳言加上去的。判 misleading。
邊界說明：引號內的「憑什麼當副總統，憑什麼出來選總統」並非原話，依 spec 7.1「完整紀錄能證明他說的是別的」也可主張 false；本案取 misleading，因為材料真實、主要問題是去脈絡。判成 false 也算可接受的鄰近答案。
脈絡問題：out_of_context。
「國民黨看不起礦工的兒子」是從片段推出的評價，屬 not_factual。
公式估算：唯一計分命題 misleading（0.25）→ 15＋20＋15 ≈ 50，部分符合；人工判定「不符」，因為訊息要傳達的意思和原話相反。"""

[[claim]]
original = "韓國瑜昨晚造勢晚會上說，賴清德是礦工的兒子「憑什麼當副總統，憑什麼出來選總統」"
expected_label = "misleading"
core = true
importance = 5

[[claim.ground_truth]]
url = "https://www.youtube.com/watch?v=zU_k1BSl9D0"
excerpt = "（0:00–0:29，轉寫）當賴清德說出，中華民國是災難，中華民國憲法是災難的時候，他已經沒有資格參選中華民國總統。大家說對不對，沒有中華民國的保護，沒有政府的照顧，一個礦工的小孩，怎麼能當上中華民國的副總統，然後現在來準備參選中華民國的總統。"

[[claim.ground_truth]]
url = "https://www.youtube.com/watch?v=u89gjx6Djl8"
excerpt = "（2:24–2:54，轉寫）當賴清德說出，中華民國是災難，中華民國憲法是災難的時候，他已經沒有資格，參選中華民國總統，大家說對不對？沒有中華民國的保護，沒有政府的照顧，一個礦工的小孩，怎麼能當上中華民國的副總統，然後現在來準備，參選中華民國的總統"


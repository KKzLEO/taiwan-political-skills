id = "case-032"
title = "「海鯤艦遭爆進水、主機故障動不了，測試進度僅十分之一」：只有前顧問一個人的說法，海軍不評論，查不到能證實或推翻的紀錄"
input_type = "text"
input = """海鯤艦遭爆「進水、主機故障動不了」
海軍不評論
海軍前顧問郭壐爆料指海鯤
艦艙內進水,導致主機故
障,且船上整合管理系統的
測試進度也僅達10分之1
要聞"""
target = "政府機關"
expected_result = "無法判定"
found_via = "https://cofacts.tw/article/k5tZjZYBeCQ-azEqrxS9"
notes = """沒有出處的爆料、查不到證據也沒有直接反證（N 類）：關鍵說法只來自一個人的口頭爆料，主管機關不評論，公開資料既不能證實也不能推翻。訊息原文取自 Cofacts（文章 k5tZjZYBeCQ-azEqrxS9，2025-05-01 收錄，UTC 19:36，即台灣時間5月2日凌晨，1人回報），是新聞截圖的文字辨識結果，逐字照抄，換行、半形逗號和「郭壐」（應為郭璽）的辨識錯字都保留，只去掉結尾的空行；最後的「要聞」是截圖上的版面標籤。沒有找到針對這則訊息的查核報告，答案來自中央社對國防部記者會和台船新聞稿的報導。訊息質疑海軍和國造潛艦計畫，沒有攻擊或稱讚特定政黨，target 取政府機關。
判定關鍵：
1.「海鯤艦遭爆進水、主機故障動不了」判 unverified，這是整則的主旨：這個說法的來源只有前海軍顧問郭璽的口頭爆料，報導裡沒有看到他提出文件、照片或其他人的證詞。海軍司令部4月30日回應只說海鯤艦正在做主要系統聯測與調校、「相關報導不予評論」；5月6日國防部記者會上，海軍參謀長邱俊榮說海軍「沒有進一步評論」，被追問是否遇到嚴重狀況時說「並沒有重大到沒辦法執行」。這是否認「嚴重到做不下去」，沒有正面回答有沒有進水、主機有沒有故障。海鯤艦的測試紀錄屬於軍事機密，查不到第一手文件。
2. 之後的發展不能當反證：中央社2025-06-17報導，海鯤艦當天駛出高雄港做第一次海上測試、下午返港。這證明六週後艦艇能靠自己的動力航行，但不能回頭證明4月沒有發生過進水或主機故障（故障可能已經修好，也可能從來沒發生）。所以不判 false。如果只針對「動不了」三個字、用6月的海測判 false，算可接受的鄰近判定；「進水導致主機故障」這個核心仍然查不到。
3.「海軍不評論」判 true：兩次回應都是不評論（Nownews 引述海軍司令部4月30日回應、中央社5月6日報導）。
4.「海軍前顧問郭璽爆料指…」判 true，但只證明「他這樣說過」：中央社5月6日報導記者會上媒體「引述前海軍顧問郭璽的說法」，Nownews 也寫「前海軍顧問郭璽日前爆料稱，海鯤號發生管線破裂進水，導致主機故障」。這一條重要性2，不能拿它當成內容為真的證據。
5.「船上整合管理系統的測試進度也僅達10分之1」判 unverified：邱俊榮說這個數字「和海軍所掌握的數字不一樣」，但沒有公布海軍掌握的數字，也說不會針對個別問題回覆。只有一方說一成、另一方說不對但不給數字，查不到可以核對的紀錄。
為什麼是無法判定：訊息最想讓讀者相信的是「海鯤艦進水、主機故障、測試只做了一成」。這三件事都只有郭璽一個人的說法；海軍不評論或只否認嚴重程度，台船和海軍沒有公布可以核對的測試紀錄，之後的海測也不能回頭推翻。真的部分只有「有人這樣爆料」「海軍不評論」，這兩件事不是訊息要讀者相信的重點。查核時如果因為「郭璽確實說過、海軍確實不評論」就判符合，是把「有人說」當成「是真的」；如果因為海軍否認嚴重、6月順利出海就判不符，是把間接跡象當成直接反證。
時間處理：訊息沒有寫日期，Cofacts 收錄時間是背景資料，使用者手上沒有。訊息沒有「剛剛」「最新」這類相對時間，也沒有叫讀者做事，不另寫時間命題；講的是2025年4月底的爆料，照事件內容判。今天（2026-11-19）再讀，海鯤艦後來已經出海測試（2025年6月起），查核報告應補充這一點，但4月是否發生過進水和主機故障仍然查不到。郭璽2025年9月又說測試延宕是整合載台管理系統的問題，海軍同樣回應不評論個人言論（中央社2025-09-30），情況沒有改變。
摘錄說明：中央社和 Nownews 摘錄取自網頁內文。海軍司令部4月30日的回應沒有找到官方網站上的原文，以 Nownews 的引述為證據。
下載檔（dl/）：cna_202505060085.html、cna_202506170389.html、nownews_6678483.html、cofacts_six_articles.json。
複核（2026-11-20）：查了什麼：用 Cofacts API 確認文章 k5tZjZYBeCQ-azEqrxS9 存在（圖片類、2025-05-01T19:36Z 收錄、1人回報、沒有回應），input 和 Cofacts 文字去掉結尾換行後完全相同。重新下載中央社 202505060085、202506170389 和 Nownews 6678483，原有的全部摘錄都逐字存在，也支持原本的判定。截圖的原始報導是聯合新聞網〈測試一拖再拖...海鯤艦遭爆「進水、主機故障動不了」 海軍不評論〉（udn.com/news/story/10930/8709092），現在已經下架打不開，所以不拿來當證據。轉述它的報導寫郭璽在直播說海鯤號「4月動不了，5月也動不了」，所以「動不了」也是郭璽的說法。海鯤艦確實到2025年6月14日才第一次在港內航行，但「因為進水、主機故障所以動不了」仍然查不到。
後續發展：(1)《鏡報》2025-12-06 的獨家報導（LINE TODAY 轉載）引述台船的匿名知情人士，說海鯤艦2025年初做泊港測試時，二部主機排煙時海水倒灌、整個主機進水，一部主機連發電機報銷、送回原廠檢修，還說6月17日首次海測時主機無法啟動，是用電瓶推進。這是第二個說主機進水的來源，但是匿名、沒有文件，也不能確定和郭璽不是同一個消息來源。台船回應主機都已裝艦啟動運轉、「一部主機未安裝」不實，沒有正面回應進水這件事。所以命題1仍判 unverified，不升為 true 或 mostly_true，也不因台船的回應判 false。(2) 海軍2025-10-13證實，潛航前還剩「主機與電力管理系統」和「整合式儎台管理系統（IPMS）」兩項待調校，並說是協調廠家排程、不是技術瓶頸（Nownews 6741681）。這說明主機和 IPMS 確實是卡關的地方，但不能證實4月有進水，也不能證實「十分之一」。(3) 台船2025-11-29說「全艦水密門現況測試均正常，報導並不屬實」，講的是錨機和水密門的報導，不是4月的進水爆料，不當反證。(4) 到查核日，海鯤艦已經做過多次潛航測試（自由時報2026-11-16：10月13日完成第24次出海、第18次潛航測試後，已超過1個月沒有出港，在台船大塢「坐墩」），還沒交艦；台船承諾年底前交艦。這些都不能回頭證實或推翻2025年4月的狀況。
改了什麼：(1) 命題3「海軍前顧問郭壐爆料指海鯤艦艙內進水,導致主機故障」從 true 改成 unverified。理由是 neutralize.md 拆題規則第4條和共同規則的「引言」：引述的內容是訊息要讀者相信的事實時，判定看內容，有沒有說過寫進理由；「他真的說過、而且內容正確，才判 true」。郭璽確實這樣說過（中央社、Nownews、公視都有報導），但進水導致主機故障查不到，所以判 unverified。上面判定關鍵第4點寫的 true，以這一段為準。這一改不影響整則結論。(2) 新增證據：命題1加上《鏡報》兩段（匿名知情人士的說法和台船的回應），當作後續發展的背景；命題4加上公視 749997 邱俊榮在記者會的原話，和 Nownews 6741681 海軍10月的說明。原有證據全部保留。(3) 標題的「只有前顧問一個人的說法」是就2025年4月的情況說的；後來多了《鏡報》的匿名消息來源，但仍然沒有可以核對的紀錄，標題沒有改。
相鄰的『false』（命題4）也講得通：海軍是主管機關，參謀長在記者會明說「十分之一」和海軍掌握的數字不一樣；但海軍沒有公布數字，屬於被批評的機關否認、沒有可以核對的紀錄，所以維持 unverified。命題3維持原作者的 true 也講得通：如果把這句當成「報導有人爆料」，而不是要讀者相信內容。整則的「無法判定」不在符合到不符那條量表上，沒有相鄰的一級；判「符合」等於把「有人說」當成「是真的」，不採用。
未來可能讓答案改變的事：台船承諾2026年底前交艦（海軍說沒有交艦時間表），交艦前後國防部可能向立法院報告測試情況；台船或海軍公開測試紀錄、監察院調查，或《鏡報》的消息來源出面，都可能讓4月的進水和主機故障變成查得到。目前沒有排定在未來幾週公布2025年4月測試紀錄的事，答案短期內大概不會變。

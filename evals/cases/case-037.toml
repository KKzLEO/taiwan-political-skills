id = "case-037"
title = "「運動幣登記時間：2026年1月26日至2月8日」：60萬份、500元、分流和抽籤日期都對得上運動部新聞稿，但登記早已截止、籤也抽完了"
input_type = "text"
input = """2026年起「動滋券」轉型為「運動幣」，預計發放60萬份。
面額對象：每份面額500元。適用對象擴大至16歲以上國民（民國99年1月1日以前出生者皆可登記）。
登記時間：2026年1月26日至2月8日，於動滋網（http://500.gov.tw）登記。
分流機制：採身分證末碼分流1月31日 起開放全民不分流登記。
抽籤日期：2026年2月12日直播公開抽籤。
使用時間：115/3/1 早上10點～115/12/31凌晨12點
1/26身分證尾數0&1
1/27 身分證尾數2&3
1/28身分證尾數4&5
1/29 身分證尾數6&7
1/30身分證尾數8&9
1/31-2/8不限尾數登記"""
target = "政府機關"
expected_result = "不符"
found_via = "https://cofacts.tw/article/3b6ojvwbxnnfk"
notes = """叫讀者在期限前去登記、期限已過（T 類）：內容每一項都對，但整則是一張登記時程表，要讀者做的事（1月26日到2月8日上動滋網登記抽籤）在今天已經不可能做到。訊息原文取自 Cofacts（文章 3b6ojvwbxnnfk，2026-01-02 收錄，UTC 01:24，即台灣時間當天09:24，10人回報，登記開始前三週多），逐字照抄，「1月31日 起」中間的空白和各行寫法都保留。Cofacts 上的回覆標為「含有正確訊息」（引今周刊報導），那是收錄當時的判斷。我沒有另外搜尋查核機構的報告，答案全部來自運動部在動滋網（500.gov.tw）公告的三份新聞稿，分流表另用公視報導補上。訊息介紹運動部的政策，沒有攻擊或稱讚特定政黨，target 取政府機關。
判定關鍵：
1. 內容都對得上運動部115年1月22日新聞稿〈青春動滋券轉型運動幣 打造全民運動品牌形象〉：「青春動滋券」轉型為「運動幣」，對象擴大到16歲以上全民，預計發放60萬份500元；民國99年1月1日以前出生的國民可在115年1月26日至2月8日到動滋網登記；前5天依身分證字號末碼分流（1月26日為末碼0、1，以此類推），1月31日起全面開放，2月12日公開直播抽籤。五條都判 true。
2. 分流表（1/27是2、3，一路到1/30是8、9）新聞稿只寫「以此類推」，公視2026-01-05的報導列出完整對照表，和訊息一致，判 true。公視網頁的對照表是表格，摘錄取自網頁原始碼裡的結構化資料（JSON-LD），表格欄位連在一起，照原樣抄。
3. 使用時間：運動部2月12日新聞稿寫「將自3月1日上午10時開放中籤民眾領用，抵用期限至12月31日止」，判 true。訊息寫「12/31凌晨12點」，官方只寫到12月31日止，沒有寫幾點；照一般用法是指12月31日結束的那個半夜，不算錯。
4. 但登記已經結束：運動部115年2月12日新聞稿〈115年運動幣抽籤揭曉〉寫明「於1月26日至2月8日開放民眾登記參加抽籤，符合資格者超過459萬人」，當天抽出60萬名；2月22日新聞稿說3月1日起開放中籤民眾領取。也就是今天（2026-11-19）登記已截止九個多月，籤也抽完了，沒登記的人不能再登記，沒中籤的人也領不到。動滋網首頁的公告區（2026-11-19 下載）在這之後只有暫停交易公告和店家說明，沒有第二次登記的公告。
為什麼是不符：這則訊息最想讓讀者做的事是「照這張時程表去登記運動幣」，登記日期就是它的主旨。內容本身沒有錯，但依時間規則，訊息叫讀者做的事已經過期，主旨不成立，預期「不符」。查核時如果只核對數字和日期就判「符合」，會讓今天才收到這則訊息的人以為還能登記。
要留意的地方：這則訊息沒有「趕快去登記」這類明講的呼籲，呼籲是隱含在「皆可登記」和分流表裡。訊息裡的日期都寫了年份（2026年、115），讀者看得出是哪一年，所以如果有人主張「內容全對、日期也寫明了，讀者不會被誤導」而判「符合」或「大致符合」，是把它當成政策說明而不是登記通知來讀；本案照時間規則當成登記通知，判「不符」。已經中籤的人到2026-12-31前仍然可以使用運動幣，查核報告應該補上這一點，但這不是訊息要讀者做的事。
時間處理：使用者今天（2026-11-19）收到訊息、今天要求查核；沒有日期的轉傳文字算查不到發布時間，Cofacts 收錄時間不算發布時間。訊息裡的日期都是寫明年份的絕對日期（2026年1月26日至2月8日、2026年2月12日、115/3/1～115/12/31），不用換算，事件本身照內容判 true。訊息沒有「剛剛」「最新」這類相對時間，不另寫「訊息暗示的時間」命題。另外寫一條隱含的期限前提「運動幣的登記期限還沒到，讀者現在還可以照這份時程登記」，錨在「登記時間」那一句，依查核日期判 false（登記2026-02-08截止、2026-02-12已抽籤），重要性5，因為去登記就是整則要讀者做的事。
後續進度提醒：116年（2027年）會不會再辦運動幣、什麼時候登記，到今天沒有看到公告。即使之後公告新的一期，這則寫明2026年日期的訊息仍然是過期的，判定不變。
比對注意：eval-compare 依原文相似度配對。期限前提和「登記時間」那條事件命題用的是同一句原文（一條 true、一條 false），流程如果把前提錨在別句（例如分流表），這條可能配不到，要回到 claims.json 人工確認；結果是否「不符」不受影響。
摘錄說明：新聞稿 PDF 摘錄只去掉排版造成的換行和行內多餘空白，數字前後的空白照 pdftotext 的結果保留；1月22日新聞稿原文有「1 月 31 日起起全面開放登記」的重複字，照原樣抄。新聞稿網址裡的中文檔名要做網址編碼才下載得到。
公式估算：(3×1＋3×1＋4×1＋2×1＋2×1＋2×1＋2×1＋5×0)/23 ≈ 78，會落在大致符合；人工判定「不符」，因為唯一錯的那一條正好是主旨的前提。
下載檔（dl/）：500gov_news_114.pdf（1月22日新聞稿，含 .txt）、500gov_lottery_result.pdf（2月12日新聞稿，含 .txt）、500gov_open_0301.pdf（2月22日新聞稿，含 .txt）、500gov_user_guide_115.pdf（含 .txt）、500gov_home.html、pts_789102.html、cofacts_candidates_a.json。
複核（2026-11-20）：用 Cofacts API 重抓文章 3b6ojvwbxnnfk，原文逐字相同（2026-01-02 收錄，10人回報，回覆標「含有正確訊息」）。重新下載運動部1月22日、2月12日、2月22日三份新聞稿和公視2026-01-05報導，原有13筆摘錄去掉換行和空白後都逐字找得到，也都支持原判定，沒有刪換。新增兩筆第一手證據，都取自動滋網首頁連結的運動部〈115年運動幣領用懶人包〉（PDF 建立於2025-12-30）：一筆補在分流表命題（官方自己的分流對照表，原本只有公視的轉述）；一筆補在使用時間命題，官方寫明「自115年3月1日10時起 至12月31日24時止」。懶人包的分流表是表格，pdftotext 依欄位順序輸出，摘錄照這個順序、去掉換行抄。標籤和預期結果都沒改。
後續發展：動滋網首頁（2026-11-20 下載）的運動幣專區仍寫「本年度運動幣已於115年2月12日順利完成公開抽籤作業」，公告區只有3月3日、8月7日兩則暫停領幣及交易公告，沒有補登記或遞補抽籤的公告；搜尋新聞也沒有找到115年的第二次登記。運動部〈運動幣措施實施計畫〉（115.1.1）寫「運動幣自 115 年起每年常態發放，採登記抽籤」，所以116年應該還會有新一期登記，但到今天還沒公告日期。另有一個不同的管道：運動部9月推出「揮汗有禮」延續活動（9月29日至12月6日，累計上傳9週運動紀錄，可參加116年運動幣5萬份的抽籤；今周刊2026-09-24報導）。這不是訊息講的登記，照訊息去動滋網登記一樣做不到，不影響判定，查核報告可以順帶提。
使用時間那條：官方寫到「12月31日24時止」，訊息寫「115/12/31凌晨12點」。照字面，「凌晨12點」是12月31日一開始的零時，比官方早了一天；但這種說法常被拿來指當天結束的半夜，而且就算照字面也只是把期限說早，不會讓人錯過，所以維持 true。相鄰的 mostly_true 也講得通。
相鄰的「部分符合」也講得通：訊息前兩行和使用時間是政策介紹，到今天仍然正確（60萬份、500元、中籤者到12月31日都還能用），可以說主旨只錯了「現在還能登記」這一半。但整則的主體是登記日期和分流表，要讀者做的事就是去登記，依時間規則這件事已經過期，維持「不符」。
未來幾週可能讓答案改變的事：116年運動幣的登記時程可能在12月到明年1月公告（今年是1月22日發新聞稿、1月26日開放）；「揮汗有禮」的抽籤結果預定12月31日前公告。這些都是新的一期，訊息寫明的是2026年1月26日至2月8日，那段登記已經結束，判定不受影響。如果有人拿這則訊息主張「明年同樣時間還能登記」，查核報告要說明那是另一期、日期以運動部公告為準。複核下載檔放在 .work/keys/work/case-037-庚/dl/（三份新聞稿、懶人包、實施計畫、動滋網首頁、公視報導、Cofacts 原文）。

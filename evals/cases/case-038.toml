id = "case-038"
title = "公視報導賴清德宣布國軍4月1日起加薪、作戰部隊基層最多每月增1.2萬元：金額和生效日都對得上總統府新聞稿，徐巧芯那句話查不到第二個來源"
input_type = "url"
input = """https://news.pts.org.tw/article/743236"""
target = "民進黨"
expected_result = "符合"
found_via = "https://cofacts.tw/article/3avvww7xfuksc"
notes = """網址輸入路徑測試（U 類），內容是賴清德總統宣布國軍加薪的報導，數字多、可以逐項對第一手資料。同一件事在 Cofacts 上被回報的是聯合報的網址（文章 3avvww7xfuksc，2025-03-21 收錄，1人回報，https://udn.com/news/amp/story/10930/8622486），那個網址今天（2026-11-19）已回傳404；本案改用公視新聞網同一天對同一件事的報導〈賴清德宣布國軍4/1起加薪 作戰部隊基層最多每月增1.2萬元〉（2025-03-21 12:49 發布，不用登入就能讀全文，2026-11-19 下載）。答案來自總統府當天的新聞稿（含致詞全文）。報導的主角是民進黨籍的總統宣布政策，也轉述了國民黨立委的批評，target 取民進黨。
判定關鍵（總統府新聞 39132〈總統勗勉立即備戰操演部隊 宣布調整待遇當後盾 盼朝野團結支持國軍〉，114年03月21日）：
1. 宣布加薪這件事是真的：總統府新聞稿寫賴清德當天上午到空軍松山基地勗勉「立即備戰操演部隊-衛戍第二戰鬥隊」，並「宣布自4月1日起調整相關國軍待遇」。報導寫「前往松指部勗勉陸戰66旅官兵」，松指部就是空軍松山基地指揮部；總統府新聞稿沒有寫這支部隊來自哪個旅，「陸戰66旅」這個細節只有媒體報導，不影響判定，判 true。
2. 金額全部對得上致詞全文：志願役勤務加給，少校以下從10,000元調整為15,000元（加5,000）、中校與上校增加4,000元、將官增加3,000元；戰鬥部隊加給，第一類型從5,000元調整為12,000元（加7,000）、第二類型從3,000元提升到7,000元（加4,000）；作戰部隊的基層官士兵加給最高提升12,000元（5,000加7,000）；4月1日生效。報導把名稱簡寫成「志願役加給」，數字沒有錯，判 true。
3. 三句賴清德的話都在致詞全文裡：「少校以下軍官與士官、士兵，是作戰部隊的主力，將從10,000元調整為15,000元」「臺灣會堅定地站在自由民主這一邊，堅定地站在反對極權併吞的這一邊」「調整國軍待遇是一個長期的進程，要經過嚴謹的討論，絕不是漫天喊價」。報導的引述只有數字寫法和「臺／台」的差別，判 true。
4. 顧立雄說還有第二波加給，判 true：中央廣播電臺2025-03-25報導，賴清德宣布提升加給後，「國防部長顧立雄則透露還有第二波加給提升計畫」，內容是戰航管、電偵、網路戰加給。報導引號裡的逐字內容我沒有另外取得記者會錄影，判定針對「說過還有第二波、對象是這三類」這件事。
5. 徐巧芯那句「會堅持國軍志願役加給2萬塊的版本」判 unverified：這句話我只在這篇報導看到。TVBS 2025-03-04 報導過她主張「國軍有加兩萬塊的價值」，立場對得上，但那是另一天的另一句話；3月21日這句的原始錄影或其他媒體的紀錄沒有找到。重要性2，不影響整體。流程如果找到公視的新聞影片而判 true，算可接受的鄰近判定。
為什麼是符合：報導要讀者知道的是「賴清德宣布國軍4月1日起加薪、各級加多少、基層最多加1萬2千元」，這些都逐項對得上總統府的致詞全文；查不到的只有一句在野黨立委的回應，不是報導的重點，也沒有反證。
「學者分析，共軍可能對台發動突襲，陸戰隊可以迅速反應，執行反機降任務」和國防院研究員舒孝煌的說明是分析意見，屬 not_factual。「國防部表示，部隊的戰術位置是國家機密」沒有另列命題。
時間處理：這是新聞網頁，發布時間查得到（2025-03-21）。「今（21）日」「上午」換成2025年3月21日，「4月1日」是2025年4月1日；依發布時間判斷是對的就照判對，不因為今天（2026-11-19）讀起來是舊聞而判錯，也不另寫「訊息暗示的時間」命題。
之後的發展（查核報告可以補充，不影響判定）：立法院2025年6月修正軍人待遇條例，把志願役加給另訂為每月3萬元，行政院和立法院對預算有爭議（聯合報報導）；總統2026年8月又宣布新增第三類型戰鬥部隊加給（中央社2026-08-19）。今天的讀者不能把這篇報導的金額當成現行的全部加給，但報導本身在發布時是正確的。這些後續沒有逐一下載查證，只當提醒。
摘錄說明：總統府新聞稿摘錄取自網頁內文。總統府網站的新聞編號不是照日期等距排列，39132 是用相鄰編號逐一試出來的。
下載檔（dl/）：pts_743236.html、p_39132.html（總統府新聞稿）、rti_2243114.html、tvbs_2797058.html、tvbs_2815267.html、udn_8622486.html（404 頁面）、cofacts_urls_2025.json。
複核（2026-11-20）：重新下載公視原文、總統府新聞稿39132、央廣、TVBS，原有12筆摘錄都逐字對得上，命題標籤和整則「符合」都不改。Cofacts API 確認文章 3avvww7xfuksc 存在（2025-03-21 收錄，1人回報，連結是聯合報〈賴總統宣布志願役軍人調薪 最高月增12000〉），聯合報網址今天仍回404，改用公視同一天對同一件事的報導合理。新增三筆證據：(1) 第1條補台灣英文新聞轉載中央社的內文「視導駐守的海軍陸戰隊陸戰六六旅衛戍第二戰鬥隊」，「陸戰66旅」除了公視之外有中央社這個獨立來源，總統府只寫了「衛戍第二戰鬥隊」，沒有寫是哪個旅；(2) 第4條補同一頁引述的國防部新聞稿「奉行政院114年3月20日核定，並自114年4月1日起生效」，表示這不只是總統的宣示，行政院已經核定；(3) 第9條補央廣內文「將請行政院核定後再公布」，比原本兩筆更貼近報導裡顧立雄那句話。徐巧芯那句話再搜一次，仍然只有公視報導，公視頁面嵌的影片（YouTube XeCwEI9Q9M0，「20250321 公視晚間新聞」）是同一家的新聞片段，不是完整錄影，維持 unverified；流程如果把這段新聞影片當成她親口說的紀錄而判 true，算可以接受的相鄰判定，不影響整體。之後的發展再查一次：立法院2025年三讀修正軍人待遇條例，把志願役加給不分軍階訂為每月3萬元，行政院以聲請釋憲等理由沒有編進總預算；總統2026-08-19宣布自2026年7月1日起新增第三類型戰鬥部隊加給每月4000元（ETtoday 2026-08-19 https://www.ettoday.net/news/20260819/3222188.htm ，內文「立法院去年三讀修正通過《軍人待遇條例》部分條文，明定志願役加給不分軍階調高至每月3萬元」）。這些都是在2025年4月1日那次加薪之上再往上加，沒有撤銷或改掉那次加薪，報導在發布時是正確的；它是有發布時間的新聞網頁，照發布時間判。相鄰的「大致符合」比較難講通：唯一查不到的是在野黨立委一句次要的回應，沒有反證，不算細節錯誤。未來幾週可能讓答案改變的事：沒有。軍人待遇條例的釋憲如果有結果，影響的是現在領多少，不影響這篇2025-03-21的報導對不對。複核下載檔放在 .work/keys/work/case-038-庚/dl/。
"""


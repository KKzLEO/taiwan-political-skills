notes = """正確的基準案例（G 類）：攻擊民進黨的圖卡，十二個刑期數字全部正確，不能因為標題帶評價就降分。訊息原文取自 Cofacts（文章 3i5IDJ8BEY7yIwhpCiz-，2026-06-28 收錄，UTC 03:31，即台灣時間當天11:31，1人回報，二審宣判後第3天），是圖片文字辨識的結果，逐字照抄，只去掉結尾的空行。同一秒另有一則較短的圖卡（3S5IDJ8BEY7yIwhpCiz9，「綠營滲透共諜二審全輕判／吳釗燮前助理何仁傑『改判無罪』」），本案只用這一則。沒有找到針對這則訊息的查核報告，答案來自臺北地院新聞稿和公視、中央社的宣判報導。
文字辨識的讀法：原圖是每人一列「求刑／一審／二審」的表格，辨識後數字的順序被打散。黃取榮是「求刑18年6個月、一審10年、二審6年」；邱世元是「求刑7年、一審6年2個月、二審5年」（中間多一個「5」是辨識雜訊）；吳尚雨的「二審3年」被排到何仁傑那一段，所以何仁傑底下出現「二審3年」「二審無罪」兩個：3年是吳尚雨的，無罪是何仁傑的；「【政客爽」是圖卡來源的浮水印。照這個讀法逐項核對。
判定關鍵：
1. 求刑：公視2025-06-10報導北檢起訴，「合計求處18年6個月、邱7年、何9年、吳5年」，四個數字都和圖卡相同。北檢新聞稿沒有另外取得，以公視轉述為證據。
2. 一審：臺北地院114年度國訴字第2號新聞稿（114年9月25日宣判），黃取榮應執行有期徒刑10年、邱世元應執行6年2月；何仁傑、吳尚雨的刑期在新聞稿裡寫「如附表六主文欄所示」，沒有列出數字，以中央社同日報導為證據（何仁傑8年2月、吳尚雨4年）。
3. 二審：公視2026-06-25報導高等法院宣判，「黃取榮從10年徒刑改判為6年，邱世元與吳尚雨也減輕為5年和3年，外交部辦公室前諮議何仁傑則逆轉獲判無罪」。司法院新聞查詢在115年6月24日至26日沒有高院針對本案的新聞稿（已翻列表確認），所以二審以公視報導為證據。
4. 身分：黃取榮是新北市議員李余典前特助，邱世元是民進黨民主學院前副主任，吳尚雨是時任副總統辦公室諮議（公視稱前總統府辦公室諮議），何仁傑是時任外交部長辦公室諮議（臺北地院新聞稿、公視）。圖卡寫的「民進黨市議員助理」「民主學院副主任」「總統府諮議」都對得上；何仁傑的「一等諮議」，法院和媒體只寫「諮議」，職等沒有另外查證，不影響判定。
為什麼是符合：圖卡可以查證的內容（四個人的身分、求刑、一審、二審）都正確。「民主大輕判」是對判決的評價，屬 not_factual；二審四人都比一審輕是事實，但輕不輕、該不該是意見，不能當成錯誤，也不能因為語氣是攻擊就降分。
時間處理：訊息沒有寫日期，Cofacts 收錄時間是背景資料，使用者手上沒有。訊息沒有相對時間，也沒有叫讀者做事，不另寫時間命題；求刑、一審、二審都是已經發生的事，照內容判。今天（2026-11-19）再讀要補充一件事：聯合報2026-10-30報導，最高法院前一天把黃、邱、吳有罪部分和何仁傑無罪部分都撤銷，發回高等法院更審，四人有罪與否還沒確定。圖卡講的是二審當時的結果，這件事不因發回而變成錯的，但查核報告應該提醒讀者二審判決已經不是目前有效的結論。更審結果日後出來，也不改變「二審曾經這樣判」。
摘錄說明：公視和中央社（Newtalk 轉載）摘錄取自網頁內文；臺北地院新聞稿摘錄照網頁原樣，刑期是國字大寫。
下載檔（dl/）：pts_755355.html、pts_814767.html、judicial_tpd_114guosu2.html、judicial_tpd_114guosu2_attach.pdf（含 .txt）、newtalk_20250925_995651.html、udn_9587944.html、udn_9845920.html、cofacts_six_articles.json；司法院新聞列表是 tmp_jud_p1.html 至 tmp_jud_p7.html（每頁60筆，115年6月24日至26日在 tmp_jud_p6.html）。
複核（2026-11-20）：第一位獨立複核員同意「符合」，另外提出三點：邱世元的求刑少算了洗錢那一項、「二審 無罪」那條的聯合報摘錄看不出無罪、相鄰的「大致符合」也講得通。裁定者重新下載公視兩篇（2025-06-10、2026-06-25）、中央社兩篇（2025-04-21、2025-06-10）、Newtalk 轉載的中央社一審稿、聯合報兩篇（2026-06-25、2026-10-30）、自由時報2026-07-09、臺北地院新聞稿和它的附表 PDF，並向 Cofacts 確認原文（2026-06-28 收錄、圖片類、1人回報、沒有任何回應；去掉結尾空行後和 input 完全相同）。原有15筆摘錄都逐字找得到。預期結果和七條命題的標籤都不改，只修證據和說明；上面和這段不一致的地方，以這段為準。
改了什麼：
一、「二審 無罪」那條的聯合報摘錄原本是「一審依違反國家機密保護法等罪判邱世元6年2月、吳尚雨4年、何仁傑8年2月徒刑。」，講的是一審，撐不起「二審無罪」，換成同一篇緊接的下一句「高院今改判邱5年徒刑，併科罰金10萬元，沒收45萬餘元；吳尚雨改判3年徒刑；何仁傑則獲判無罪。」
二、補第一手或更清楚的證據：邱世元那條加中央社2025-06-10（檢方對邱世元國家機密保護法部分求處7年以上、洗錢部分求處1年以上）；吳尚雨、何仁傑兩條各加一筆臺北地院新聞稿附表（何仁傑處有期徒刑捌年貳月、吳尚雨處有期徒肆年，附表原文漏了一個「刑」字，照原樣抄；PDF 裡這兩句跨行，摘錄是去掉換行後的文字）；何仁傑那條加中央社2025-04-21（外交部長林佳龍談「何仁傑擔任的『一等諮議』職務」）。上面第4點說「一等諮議」職等沒有查證，以這段為準：圖卡的職稱是對的。
三、邱世元的求刑：複核員說的屬實。檢方對邱世元求刑是兩項，國家機密保護法7年以上、洗錢1年以上，合起來8年以上（中央社2025-06-10；公視2025-06-10同一篇的下一段也寫了「分別對兩人求處1年半、1年徒刑」）。圖卡給黃取榮的18年6個月是含洗錢的合計（9＋8＋1年6月），給邱世元卻只列主罪的7年；一審的6年2月則是含洗錢的應執行刑（附表：國家機密保護法5年8月、洗錢1年）。標籤維持 true：檢方確實就主罪求處7年，公視導言也寫「合計求處18年6個月、邱7年」，圖卡沒有寫「合計」，7年不是錯的數字，只是少列一項；而且少列的方向是把求刑說輕，對圖卡「大輕判」的說法反而不利，不會誤導。命題層級判 mostly_true 也講得通（把求刑那一列當成合計來讀，邱世元差1年）。
相鄰的「大致符合」也講得通：理由一，如果把求刑那一列當成合計，邱世元少算1年，算不影響結論的細節出入；理由二，使用者收到訊息時（2026-11-20），最高法院已在2026-10-29把二審判決全部撤銷、發回高等法院更審（聯合報2026-10-30：「最高法院昨撤銷黃、邱、吳有罪部分及何無罪部分判決，發回台灣高等法院更審，四人有罪與否尚未確定。」），現在讀到「二審 無罪」「二審 6年」的人可能以為這是目前有效的結果，嚴格的評審會因為圖卡缺少這個後續而降一級。我選「符合」，因為它比較貼合定義文字「訊息裡可以查證的說法都正確」：圖卡寫出的每個身分和數字都對得上實際的求刑和判決；訊息沒有寫日期，沒有「剛剛」「最新」，也沒有叫讀者做事，照時間規則，被後來判決取代的舊判決照事實判，和 case-021 把高虹安一審7年4月判 true 是同一種處理；而且最高法院撤銷的理由是二審調查不足、「二審逕自判決過於速斷」，法界認為對被告不利，補上這件事不會讓「二審判得比一審輕」變成錯的。查核報告應該寫出撤銷發回，但沒寫不算把整則判錯；工具判「大致符合」屬於答案卷的一級雜訊，判「部分符合」以下就是偏嚴。
其他背景：黃取榮另有一案（高檢署依國家安全法為中國發展組織罪起訴），高等法院2026-07-09判10年，可上訴（自由時報2026-07-09），這是 Cofacts 收錄之後的事，和圖卡的十二個數字無關，查核報告可以順帶提。比對風險照第一位複核員的提醒：文字辨識把吳尚雨的「二審 3年」排在何仁傑名下，工具照字面讀成「何仁傑二審3年」會判錯誤，這一則的命題配對最好人工確認。
未來幾週可能讓答案改變的事：高院更審才剛發回，沒查到排定的開庭或宣判日，幾週內宣判的機率低；就算更審宣判，「二審曾經這樣判」仍是事實，照現行規則答案不變，只要補說明。黃取榮另案的上訴結果也不影響本則。沒有預定的表決或期限。
複核下載檔在 .work/keys/work/case-030-裁/dl/。"""


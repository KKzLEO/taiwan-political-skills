id = "case-011"
title = "「幸福餐盒沒了，是藍白財劃法害的」：餐盒真的停了，但經費本來就只編到2024年"
input_type = "text"
input = """1月底之後，農業部的60元幸福餐盒計劃經費，沒了。
貧窮人的營養餐盒，沒了。
財劃法是在教訓民進黨嗎？
多少每天要等60元餐盒的困苦人，1月以後沒了指望。
藍白強推財劃法，杯葛年度總預算，全部要重編，沒經費執行的，新年度就是把全部民生福利都卡住，還不明白嗎？
#罷免簽了沒"""
target = "國民黨"
expected_result = "不符"
found_via = "https://tfc-taiwan.org.tw/fact-check-reports/agriculture-ministry-60nt-happy-meal-budget-cut-false/"
notes = """背景真、重點假：兩件真事接成一個假的因果。訊息原文取自 Cofacts 收錄的臉書粉專貼文（文章 2m3abnqtcv4eo，2025-01-09 收錄，貼文時間為1月4日），去掉開頭的粉專名稱和發文時間兩行，其餘逐字照抄。查核中心報告3422只當線索。訊息攻擊藍白（國民黨、民眾黨），target 取國民黨。
判定關鍵：
1. 背景是真的：幸福餐盒2025年確實沒有經費。農業部（原農委會）的疫後特別決算記載，「暖農民」（含幸福餐盒）只有112年6.21億元、113年6.78億元；同一段的「固農村」才有114年的錢。「1月底」停賣日期出自幸福食材網2025-01-03公告（查核中心與媒體引述，該網站現已無法連線，沒有取得原文），本案只用決算證明「2025年沒有幸福餐盒經費」。
2. 重點是假的：經費來自2023年的疫後特別預算，不是年度總預算（農委會112-03-06新聞稿）。立法院審核這筆特別預算時的決議寫明「農村送暖計畫預計於112及113年度辦理」，一開始就只編兩年，停賣是原定規劃，跟財劃法、總預算審查都無關。
3. 時序也對不上：財劃法修正案113年12月20日三讀，114年3月21日才公布（立法院法律系統、全國法規資料庫沿革）。發文的1月4日修正條文還沒公布，不可能影響任何預算的執行。
4.「沒經費執行的，新年度就是把全部民生福利都卡住」：預算法第54條規定總預算未依限審完時，新增計畫以外的計畫可依原訂計畫或上年度執行數動支，法定義務收支照常，判 false。
陷阱：「餐盒停了」「財劃法是藍白通過的」兩件事都是真的，假的是把兩件事接起來的因果。只查到其中一件真事就判「部分正確」是錯的。
脈絡問題：legal_stage_confusion（把三讀、尚未公布的財劃法當成已經卡住新年度預算）。
「藍白強推財劃法」是前提（三讀日期為真），「杯葛年度總預算，全部要重編」是事件描述加評價，兩段都沒有另列計分命題，也沒有另行查證。「多少每天要等60元餐盒的困苦人，1月以後沒了指望」「#罷免簽了沒」屬 not_factual。
摘錄說明：PDF 摘錄只去掉排版造成的換行和空白，文字照原樣。農業部決算的頁碼是第96頁（PDF第98頁）和第123頁（PDF第125頁）。這份 PDF 有幾個字是 CJK 相容字元（「年」U+F98E、「益」U+FA17、「列」U+F99C、「糧」U+F97B），摘錄照原樣保留，比對前要先做 NFKC 正規化（同 case-006）。
公式估算：(2×1＋5×0＋4×0)/11 ≈ 18，不符，與人工判定一致。"""


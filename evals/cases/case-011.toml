url = "https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=T0020001&flno=54"
excerpt = "總預算案之審議，如不能依第五十一條期限完成時，各機關預算之執行，依下列規定為之：一、收入部分暫依上年度標準及實際發生數，覈實收入。二、支出部分：（一）新興資本支出及新增計畫，須俟本年度預算完成審議程序後始得動支。但依第八十八條規定辦理或經立法院同意者，不在此限。（二）前目以外計畫得依已獲授權之原訂計畫或上年度執行數，覈實動支。三、履行其他法定義務收支。"


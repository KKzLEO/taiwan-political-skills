複核（2026-11-20）：查了什麼：用 Cofacts API 重抓文章 2vesr4qqcnh7z，原文和 input 逐字相同（2025-01-03T09:51Z 收錄、7人回報，唯一的回覆標為含有個人意見）。重新下載第16次會議議事錄、全國法規資料庫第35條（資料截止日民國115年11月13日）和沿革頁（最後一筆仍是第11筆）、ETtoday 2887483、公視 732480 和 819159、中央社 202501070363，原有摘錄都逐字找得到，也支持原判定；議事錄的記名表決名單也核對過，贊成的60人是國民黨團、民眾黨8人和高金素梅、陳超明，民進黨沒有人投贊成。另外下載立法院1月6日黨團協商會議紀錄（ppg.ly.gov.tw 的 2025010385_1.pdf，同樣要帶瀏覽器標頭和 referer，不帶會回 403），裡面有原稿沒有的兩件事：一、協商主題寫明警察人員人事條例第35條一案是「1 月 3 日黨團共識增列」，韓國瑜開場說當天的協商是「按照 1 月 3 日各黨團的共識」進行；二、柯建銘在會中說1月3日簽下的共識是「星期一朝野協商的時候加入觀光條例以及警察人員人事條例，協商後有協商結論留待在禮拜二、明天表決，沒有協商結論就照議事程序來處理」。所以1月3日在立法院確實有各黨團的協商，1月7日（星期二）表決就是那天排定的；民進黨團也簽了這個共識，這也是訊息感謝民進黨委員「願協商進入三讀」的由來。
改了什麼：「剛才在立院協商」由 unverified 改為 true，證據換成協商紀錄的兩段（原本公視、ETtoday 那兩段講的是1月6日的協商，既不能支持也不能反駁1月3日有沒有協商）。這條只判「1月3日在立院有協商」；1月3日的協商有沒有談到80%或1.25%，紀錄沒有寫，ETtoday 寫在野陣營那天「尚未凝聚共識」，又寫80%是1月6日協商時國民黨才改的版本，所以訊息把80%說成1月3日就談定，可能早說了幾天，但80%最後照樣通過，不另扣分。「並決定於1/7日星期二進入三讀」標籤不變，補上柯建銘那段，證明1月3日當天就排定了1月7日表決（共識寫的是協商沒有結論就照議事程序處理；1月6日協商沒有共識，韓國瑜宣布送院會處理，1月7日仍照排定表決三讀），不只是事後剛好在那天三讀。署名那條標籤不變，補耿繼文本人2025-10-01在警政時報（蕃新聞轉載）的專欄：他八年前選上總會長、四年前連任，2025年10月才任期屆滿卸任，所以訊息發出時他確實是總會長；但這則訊息是不是他本人發的仍然查不到，維持 unverified。1.25%：議事錄、1月6日協商紀錄（全文沒有出現「1.25」或「一點二五」）和三讀後各家報導都找不到任何版本用過1.25，維持 false。上面第6點和這段不一致的地方，以這段為準。公式估算改為 (5×1＋3×1＋4×0.75＋3×0＋2×0.75＋2×1＋1×0.35)/20 ≈ 74，仍是大致符合。
預期結果維持「大致符合」。相鄰的「部分符合」也講得通：對退休警消來說，替代率怎麼算（每多一年加幾個百分點）和有沒有三讀差不多一樣重要，可以說「修法內容」這一半講錯了；但訊息最想讓讀者知道的是藍白談定、1月7日三讀，80%上限也對，錯的只是一個公式數字，所以仍以大致符合為準。
未來幾週可能的變化：行政院聲請的釋憲到今天還沒有判決（公視2026-08-20報導：「行政院以有違憲疑慮、申請釋憲為由，沒有編列預算」），退休警消的團體行政訴訟也還在進行。憲法法庭之後如果宣告第35條違憲，會影響退休警消實際領不領得到80%，但不會改變「2025年1月7日藍白聯手三讀、條文是每年加1.75%」這些已經發生的事，本案答案不受影響。複核下載檔放在 .work/keys/work/case-034-丁/dl/：ly.pdf（議事錄）、capp_0106.pdf（1月6日協商紀錄）、moj35.html、mojhist.html、ettoday.html、pts732480.html、pts819159.html、pts823281.html、cna0363.html、ltn4915187.html、yam20251001.html、cofacts.json。

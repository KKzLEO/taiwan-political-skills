id = "case-034"
title = "「藍白合作，警消海巡退休金80%、每年再調升1.25%，1/7三讀」：80%和1月7日三讀都對，但條文是每年加1.75%，不是1.25%"
input_type = "text"
input = """有關1/3下午立法院重新審議警消海巡退休金一案，經國民黨、民眾黨委員通力合作下，剛才在立院協商，警消海巡退休金從80%調整，調整後，每年再往上調升1.25%，並決定於1/7日星期二進入三讀。

在此，深深感謝國民黨、民眾黨委員根據七成民意，為警消海巡爭取合情合理的對待外，同時也對民進黨的委員願協商進入三讀致謝意。

全國所有警消海巡在職或不在職期盼多年的事，終見曙光，永遠感銘委員們的努力和支持！

退警總會總會長耿繼文敬上114.01.03"""
target = "國民黨"
expected_result = "大致符合"
found_via = "https://cofacts.tw/article/2vesr4qqcnh7z"
notes = """主旨真、一個具體數字錯（B 類）：修法、80%、1月7日三讀都對，每年增加的百分點寫錯。訊息原文取自 Cofacts（文章 2vesr4qqcnh7z，2025-01-03 收錄，UTC 09:51，即台灣時間當天17:51，7人回報，三讀前四天），逐字照抄。Cofacts 上唯一的回覆標為「含有個人意見」，內容是批評這次修法，沒有核對訊息裡的數字。我沒有另外搜尋查核機構的報告，答案來自立法院議事錄和全國法規資料庫。訊息感謝國民黨、民眾黨立委，兩黨並列，target 取先提到的國民黨。
判定關鍵（立法院第11屆第2會期第16次會議議事錄，114年1月3日、7日；全國法規資料庫警察人員人事條例第35條）：
1.「並決定於1/7日星期二進入三讀」判 true，這是整則的主旨：議事錄記載這次會議開了1月3日（星期五）和1月7日（星期二）兩天，討論事項第四案決議警察人員人事條例第35條等條文修正通過，二讀後繼續三讀；第35條在二讀時寫進的日期就是「一百十四年一月七日」。訊息在1月3日預告1月7日處理，後來確實在那一天三讀。
2.「經國民黨、民眾黨委員通力合作下」判 true：第35條（含附表三）是照「國民黨黨團及台灣民眾黨黨團共同所提再修正動議」通過；記名表決出席110人、贊成60、反對49、棄權1，贊成名單是國民黨團委員、民眾黨8位委員和無黨籍的高金素梅、陳超明，反對的49人都是民進黨委員，棄權的是民進黨的伍麗華。
3.「警消海巡退休金從80%調整」判 mostly_true：80%這個數字對得上，但它是上限，不是起點。現行第35條第1項第4款：警察、消防、海岸巡防、移民及空中勤務總隊人員的每月退休所得替代率，任職滿15年43.25%，最高增至36年為80%，37到40年維持80%。「從80%調整」的說法不清楚，照字面可能被讀成從80%往上加；適用對象和80%這個關鍵數字正確，判 mostly_true。
4.「調整後，每年再往上調升1.25%」判 false：條文是「其後每增加一年，替代率增給百分之一點七五」。43.25%加21年乘1.75個百分點正好是80%；如果每年只加1.25個百分點，36年只到69.5%。三讀條文和公視列出的附表三逐年數字（45%、46.75%、48.5%…）都是1.75。1月3日當天藍白內部談的版本有沒有出現過1.25，查不到紀錄；本條依三讀通過、今天有效的條文判。
5.「有關1/3下午立法院重新審議警消海巡退休金一案」判 mostly_true：1月3日的院會確實排了這個案子（同一次會議的討論事項），ETtoday 2025-01-07 報導寫「上周五院會原定處理…因在野陣營尚未凝聚共識，改到今（7日）院會處理」。當天沒有審完，「重新審議」「下午」是發訊者的說法，議事錄只記到1月3日會議開到下午2時28分。
6.「剛才在立院協商」判 unverified：媒體記到的朝野協商是1月6日（公視：銓敘部「昨（6）日曾於黨團協商時表達反對立場」；ETtoday：「昨朝野協商時，國民黨將所得替代率改為提高到80％」）。1月3日下午藍白之間或和退警團體之間有沒有另外談，查不到公開紀錄，也沒有反證。
7. 署名「退警總會總會長耿繼文」判 unverified：公視2026-07-24報導稱他是「中華民國退休警察總會榮譽總會長」，可見確有其人、確實是這個團體的領導人；但這則訊息是不是他本人發的，查不到。重要性1。
為什麼是大致符合：訊息要讀者知道的是「藍白合作，把警消海巡退休金上限拉到80%的修法談定了，1月7日三讀」，這件事後來照樣發生；錯的是每年增加的百分點（1.25應為1.75），1月3日有沒有協商查不到，都不影響這個主旨。查核時如果只看到「80%」「1月7日三讀」就判符合，會漏掉1.25這個錯；因為是替退休警消說話、語氣偏頗就判部分符合或不符，也不對。
之後的發展（查核報告應補充，不影響判定）：行政院對這次修法提出覆議，遭立法院否決，總統114年4月25日修正公布（全國法規資料庫沿革第11筆；公視2025-04-26報導）。行政院認為有違憲疑慮，據媒體報導沒有照條文編列撥補預算並聲請釋憲，退休警消團體2026年仍在抗議和提告（公視2026-07-24）。全國法規資料庫第35條到資料截止日（民國115年11月13日）仍是這個條文，條文頁沒有掛憲法法庭裁判的連結。憲法法庭之後如果作出裁判，不會改變「2025年1月7日三讀、條文是每年1.75%」這幾件已經發生的事。
「在此，深深感謝…致謝意」「全國所有警消海巡…終見曙光」是感謝和評價，屬 not_factual。其中「根據七成民意」沒有交代是哪一份民調，沒有另外查證；民進黨委員在表決時全數反對或棄權，「願協商進入三讀」指的是沒有阻擋議程，屬於發訊者的客氣話，不另列命題。
時間處理：訊息本身署了日期「114.01.03」，所以發布時間查得到，是2025年1月3日。「1/3下午」「剛才」依發布時間換成2025年1月3日，「1/7日星期二」是2025年1月7日（那天確實是星期二）；依發布時間判斷是對的就照判對，不因為今天（2026-11-19）讀起來是舊事而判錯，也不另寫「訊息暗示的時間」命題。訊息沒有叫讀者在期限前做事，不需要期限前提。
摘錄說明：議事錄 PDF 摘錄只去掉排版造成的換行和空白，表格欄位之間壓成一格。議事錄網址要帶瀏覽器標頭和 referer 才下載得到。
公式估算：(5×1＋3×1＋4×0.75＋3×0＋2×0.75＋2×0.35＋1×0.35)/20 ≈ 68，大致符合，與人工判定一致。

id = "case-029"
title = "「黃國昌提案刪國土管理業務41億、另凍結41億，租金補貼砍光光」：提案和經費用途都是真的，但實際只減列約 1.47 億、凍結的部分後來解凍，租金補貼照發"
input_type = "text"
input = """民眾黨立委黃國昌提案刪除「國土管理業務」41億元，另凍結41億元。結果他提案刪除的經費，主要用在推動減輕弱勢租屋族群居住負擔的租金補貼，以及推動居住正義之社會住宅等相關工作。

連弱勢租屋族的租金補貼都砍光光，這不是亂刪預算，什麼才是亂刪預算？！

（以下新聞轉貼）
==================
民眾黨立院總召黃國昌提案，因延後「國土計畫」上路，刪除內政部國土管理署「國土管理業務」41億元"""
target = "民眾黨"
expected_result = "部分符合"
found_via = "https://cofacts.tw/article/10y1swqyyqa07"
notes = """兩個同樣重要的說法，一真一假（C 類）：「提了什麼案、這筆錢做什麼用」是真的，「租金補貼被砍光」是假的。訊息原文取自 Cofacts（文章 10y1swqyyqa07，2025-07-09 收錄，UTC 00:22，即台灣時間當天08:22，2人回報，7月26日罷免投票前），逐字照抄，空行和「==================」分隔線都保留；Cofacts 收錄的文字就到「41億元」為止。沒有找到針對這則訊息的查核報告，答案來自內政部國土管理署的四份新聞稿。訊息攻擊民眾黨和黃國昌，target 取民眾黨。
主題說明：這則講的是114年度總預算裡「國土管理業務」這一個科目的提案和凍結，和 case-026（總預算刪減總額）同屬一次預算審查，但命題和查證路徑不同。
判定關鍵：
1.「黃國昌提案刪除『國土管理業務』41億元，另凍結41億元」判 true：國土署114年1月18日新聞稿說，立委提案「刪除及凍結本署114年度及所屬預算第3目國土管理業務預算…各10%，約41.46726億元」；114年3月30日新聞稿寫得更清楚，立法院民眾黨團最早的提案是「刪減41億4672萬6仟元，並凍結41億4672萬6仟元」。提案人是民眾黨團，黃國昌當時是黨團總召，訊息說「黃國昌提案」可以接受。
2.「他提案刪除的經費，主要用在…租金補貼，以及…社會住宅」判 true：同一份1月18日新聞稿，幾乎逐字相同；國土署並說其中和國土計畫有關的經費只有301萬元。這是被提案機關自己的說明，但科目用途屬於機關最清楚的事，3月13日新聞稿列的項目（300億元中央擴大租金補貼專案、社宅直接興辦、包租代管等）相同。
3.「連弱勢租屋族的租金補貼都砍光光」判 false，和第1條同樣是主旨：刪除那一半沒有成案。國土署3月30日新聞稿說，提案「在國土署積極溝通與對外呼籲後才調整為凍結」；3月13日新聞稿說最後是凍結業務預算10%（41億4,672萬6千元）。凍結是暫時不能動支、提報告後可以解凍，不是刪除；10%也不是「光光」。實際結果：國土署115年2月3日新聞稿說，114年租金補貼總核定91萬戶，115年1月起還對新婚和育兒家庭加碼。租金補貼沒有被砍掉。
4.「這不是亂刪預算，什麼才是亂刪預算？！」是評價，屬 not_factual。
5. 最後一段轉貼的新聞「黃國昌提案…刪除…『國土管理業務』41億元」是第1條的重複，只講了刪除那一半；當成「有這個提案」判 true，重要性2。
為什麼是部分符合：訊息有兩個同樣重要的說法。「民眾黨團（黃國昌）提案刪除並凍結41億，而這筆錢主要是租金補貼和社宅」是真的，而且確實凍結了41億；「所以租金補貼被砍光光」是錯的，刪除沒有通過、凍結一成、114年照發91萬戶。只查到提案屬實就判符合，或只看到補貼沒停就判不符，都漏掉一半。
時間處理：訊息沒有寫日期，Cofacts 收錄時間是背景資料，使用者手上沒有。訊息沒有「剛剛」「最新」這類相對時間，也沒有叫讀者在期限前做事，不另寫時間命題。內容講的是114年度總預算（2025年1月審議）的提案，照事件內容判。今天（2026-11-19）再讀：114年度已經結束，租金補貼全年照常核發，「砍光光」的反證比訊息流傳時更完整。凍結的41億後來何時解凍，本案沒有查到立法院的紀錄，不影響判定。
摘錄說明：摘錄都取自內政部網站的國土署新聞稿，照網頁原樣（「414億 6726萬2千元」中間的空格是原文）。立法院114年度總預算的議事錄（第11屆第2會期第18次會議）只列表決結果，沒有逐案列出提案內容，以「國土管理」搜尋沒有結果，所以沒有列為證據。
下載檔（dl/）：moi_news_325057.html（114-01-18）、moi_news_326383.html（114-03-13）、moi_news_326788.html（114-03-30）、moi_news_336637.html（115-02-03）、ly_agendarec_110218.pdf（含 .txt）、cofacts_more_articles.json。
複核說明（2026-11-19）：兩位獨立複核員重查後都判「部分符合」，五條標籤也都同意；裁定者把他們指出的問題逐項打開來源核對，預期結果和標籤不變，補了證據，並更正下面幾處說明。標題和上面的說明如果和這段不一致（例如「刪除沒有成案，只凍結一成」），以這段為準。
一、「刪除那一半沒有成案」「刪除沒有通過」「只凍結一成」不精確。立法院公報第114卷第19期第16冊（院會紀錄，https://ppg.ly.gov.tw/ppg/download/communique1/work/114/19/LCIDC01_1141916_00003.doc ）在「主席：請宣讀第527案。」後面附的提案單掃描圖，標著「（更正）內政527」，提案人台灣民眾黨黨團、黃國昌簽名，減列數14,672萬6千元、凍結數414,672萬6千元，案由最後一段是：「爰第7款第2項第3目預算排除『03住宅政策及住宅計畫之推動』計畫所編列之對特種基金之補助400億元後其餘減列1億4,672萬6千元，並凍結第7款第2項第3目預算41億4,672萬6千元，俟國土管理署及所屬於3個月內向立法院內政委員會提出專案報告並經同意後，始得動支。」2025年1月20日下午1時42分記名表決，55比46通過。白話說：原本要刪的41億，表決前改成避開撥給住宅基金的400億（租金補貼和社宅的錢），只減列約1.47億；凍結一成（41.47億，包含住宅基金那部分）照原案通過。同一目另有國民黨團第534案（減列白匏湖園區暨社宅計畫1億2,400萬元）和第540案（減列對國內團體之捐助300萬元），刪的也不是那400億；整目合計少了約2.74億（0.66%），法定預算411億9,337萬7千元。所以查核報告寫「最後減列1.47億」或「這一目共刪2.74億、凍結41.47億」都是對的，不要當成寫錯。這段提案文字是看掃描圖抄的，公報裡的提案單沒有文字層（內政部的函說同一決議也登在審查總報告第1冊第112頁，複核員乙看過，同樣是掃描圖）；可搜尋的文字版見 Newtalk 2025-04-09 轉述經民連引用公報的段落，用字略有出入（把「計畫所編列之對特種基金之補助」寫成「計算所編列之對住宅基金之補助」）。
二、「凍結的41億何時解凍沒有查到」作廢。內政部2025年4月24日函送解凍專案報告（議案311110116760000，函文寫明依據「新增決議案號527」）；立法院內政委員會第19次全體委員會議（2025年5月12、14日）討論事項一第（十四）案就是這一案，5月14日決議「其餘各案均同意動支」，5月21日審查報告發文。訊息被回報到 Cofacts（2025-07-09）之前，凍結就已經解除。
三、「議事錄沒有列為證據」改為可以用：知道案號之後，第11屆第2會期第18次會議議事錄有「(80)『討論事項第一案內政委員會第527案予以通過』部分」的記名表決結果（出席101、贊成55、反對46）。議事錄內文確實沒有「國土管理」字樣，要用案號找。
四、原本十筆摘錄全部出自國土署新聞稿，國土署是被提案的機關，而且沒有一筆寫到黃國昌。這次補上：自由時報2025-01-18（刊出原始提案單照片：第527案，減列數和凍結數都是414,672萬6千元，提案人台灣民眾黨黨團、黃國昌簽名；並報導黃國昌回應「民眾黨的提案是針對膨脹的這些錢，減列、凍結十分之一」）、NOWnews 同日（「民眾黨團提案凍結預算10分之1、刪除10分之1，分別僅各41億元」）、立法院預算中心114年度預算評估報告（這一目有400億是撥補住宅基金，用來興辦社會住宅和住宅補貼）、國土署2025-02-14新聞稿（「立法院刪減2.74億元及凍結41.47億元」）、立法院的表決和解凍紀錄、公視2026-08-17（全國租金補貼93萬7,336戶）。第2條（錢的用途）是直接撐起主旨的關鍵事實，它錯了「砍租金補貼」就站不住，複核認為重要性給4比3貼切；這不影響標籤和整則結論。
五、查核時很可能查到黃國昌的反駁：ETtoday 2025-01-20 報導他在表決當天上午說「民眾黨團刪減數為0元，是要求凍結十分之一」。這講的是更正後的方向（實際通過的版本仍減列1.47億，只是不含住宅基金），和他1月18日自己說的「減列、凍結十分之一」不矛盾，不能據此把第1條判成 false；查核報告引用這句說明提案後來改了，則是對的。
六、時間補充：訊息稱「民眾黨立委黃國昌」，事件當時正確；他已依民眾黨兩年條款在2026年1月31日卸任立委（聯合新聞網2026-02-01）。查核報告指出這點是補充現況，不是訊息的錯。訊息結尾轉貼的那句和自由時報2025-01-18的照片說明幾乎相同，第一段又照抄國土署1月18日的新聞稿，看來是1月20日表決之前寫的；但訊息本身沒有日期，仍照查核日期讀，判定不變。2026年行政院「百萬戶租屋家庭支持計畫」草案、租金補貼改由地方分攤的討論是另一件事，和這個提案無關。
七、相鄰一級：兩位複核員都認為「不符」也講得通（把「租金補貼砍光光」當成唯一的主旨，提案屬實只算細節）。維持「部分符合」的理由：訊息開頭第一句和結尾轉貼的新聞講的都是提案本身，這一半是真的，提案人自己也承認；判「不符」會讓人以為連提案都是假的。「大致符合」不接受：「砍光光」是當成已經發生的事實講，而撥給租金補貼的錢沒有被刪，凍結也在表決後不到四個月就解除。照計分公式，這一則會隨工具怎麼拆題、給多少重要性落在50分上下，結果差一級屬於預期內的雜訊。
摘錄說明補充：立法院 ppg 網址要帶瀏覽器 User-Agent 才下載得到；公報是 Word 檔（第19期第16冊約84MB），提案單是內嵌的掃描圖。
相鄰的另一級也講得通：「不符」也講得通：如果認定訊息唯一想讓人相信的是「黃國昌把弱勢租屋族的租金補貼砍光了」，這件事沒有發生（撥給住宅基金的400億沒有被刪，凍結的一成在2025-05-14解除，114年核定91萬戶，比原訂75萬戶還多），提案屬實就只算包裝用的細節，寫法會像 case-022。我選「部分符合」，因為它比較貼合定義文字「有兩個以上同樣重要的說法，有的對、有的錯；或主旨只對了一半」：訊息開頭第一句和結尾轉貼的新聞講的都是提案本身，這一半有提案單和提案人自己的話可以證明，不是細節。往上一級的「大致符合」不接受：「砍光光」被當成已經發生的事實，也是讀者會記住的結論，不是不影響結論的細節錯誤。兩位複核員都試算過，照計分公式這一則會隨拆題和重要性落在50分上下（把「砍光光」判成誤導會到63分、只把它列為主旨會是0分），工具結果差一級是預期內的雜訊。"""


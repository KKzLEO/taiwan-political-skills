expected_label = "false"
core = true
importance = 5

[[claim.ground_truth]]
url = "https://www.judicial.gov.tw/tw/cp-1888-1516567-f62f6-1.html"
excerpt = "應執行有期徒刑拾柒年。褫奪公權陸年。"

[[claim.ground_truth]]

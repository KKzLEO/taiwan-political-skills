id = "case-031"
title = "「只剩八位大法官時修法要十人才能運作，這就是翁曉玲的癱瘓憲法法庭之術？」：人數、修法內容和後果都查得到，「癱瘓之術」是對動機的揣測"
input_type = "text"
input = """在司法院只剩八位大法官時，修法讓憲法法庭至少需要十人才能運作，這樣就算法條違憲，也沒有足夠的大法官可以做出決議。

這就是翁曉玲的癱瘓憲法法庭之術？"""
target = "國民黨"
expected_result = "符合"
found_via = "https://cofacts.tw/article/27ofo8mls812r"
notes = """事實真、另外斷言動機（M 類）：三個事實說法都查得到而且成立，最後一句把修法目的說成「癱瘓憲法法庭」，查不到翁曉玲自己這樣說。訊息原文取自 Cofacts（文章 27ofo8mls812r，2024-12-04 收錄，UTC 03:54，即台灣時間當天11:54，1人回報，憲法訴訟法修正案三讀前16天），逐字照抄。沒有找到針對這則訊息的查核報告，答案來自立法院議案關係文書、議事錄、全國法規資料庫和憲法法庭判決。訊息攻擊提案的國民黨立委翁曉玲，target 取國民黨。
主題說明：case-001 講刑法第141條之1（藐視國會罪）被113年憲判字第9號宣告失效；本案講憲法訴訟法修正和114年憲判字第1號，法條、事件和查證路徑都不同。
判定關鍵：
1.「在司法院只剩八位大法官時」判 true：114年憲判字第1號理由寫明，113年10月31日7名大法官任期屆滿，總統兩度提名都被立法院否決，「致自113年11月1日起大法官人數僅有8人」。立法院第11屆第2會期第14次會議議事錄也記載，總統提名張文貞等「7位為司法院大法官」的人事案在2024年12月24日全數未獲同意。憲法法庭網站的現任大法官頁面今天（2026-11-19）列的仍是謝銘洋、呂太郎、楊惠欽、蔡宗珍、蔡彩貞、朱富美、陳忠五、尤伯祥八位。
2.「修法讓憲法法庭至少需要十人才能運作」判 true：翁曉玲的兩個提案合起來就是這個效果。第4條草案（113年7月3日印發）把「大法官現有總額」定義為憲法增修條文所定人數，也就是15人；第30條草案（議案編號202110067550000）維持「現有總額三分之二以上參與評議」，15人的三分之二是10人。113年12月20日三讀通過的版本（第30條照民眾黨團再修正動議）寫得更直接：「參與評議之大法官人數不得低於十人。作成違憲之宣告時，同意違憲宣告之大法官人數不得低於九人」，114年1月23日公布施行。訊息流傳時還在審議，講的是提案內容；後來通過的條文同樣是十人。
3.「這樣就算法條違憲，也沒有足夠的大法官可以做出決議」判 mostly_true：照修正後的條文，八位大法官湊不到十人，確實無法評議。憲法法庭自己在114年憲判字第1號說，大法官只有8人，「如依系爭規定二所定最低出席評議人數，即無法作出任何憲法判決，僅得將聲請案件擱置或為不受理裁定，實質上癱瘓大法官的職權」，而且有3位大法官以人數不足十人為由拒絕參與評議。114年的第一件判決就是2025年12月19日這一件：其餘5位大法官以修正前的門檻作成114年憲判字第1號，宣告這次修正的第4條第3項、第30條第2項至第6項和第95條違憲、自判決公告日起失效。所以「沒有足夠的大法官可以做出決議」照條文是對的，但最後大法官還是作成了判決，而且正是宣告這條違憲，差這一點，判 mostly_true。
4.「這就是翁曉玲的癱瘓憲法法庭之術？」判 not_factual：這是對提案人動機的揣測，用問句表達。翁曉玲在提案說明寫的目的是「確保憲法法庭在審理重大案件時，能夠涵蓋更多元的意見和觀點，避免削弱裁判的多元性、公正性、專業性和公信力」，要「提高大法官議決之同意門檻」；沒有找到她說過修法是為了癱瘓憲法法庭的紀錄。「客觀上會不會造成癱瘓」是第3條已經判過的後果，「是不是她的目的」查不到，照既有案例（case-013「是怕通過」、case-023「為了救阿北」）列為意見，不計入事實判定。重要性給3，因為它是全文的收尾，但不是可以查證的說法。
為什麼是符合：依定義，「符合」看的是可以查證的說法是否都正確。這則訊息可以查證的三件事（當時八位大法官、修法門檻是十人、八人湊不到十人就無法評議）都成立，第三件還有憲法法庭自己的判決理由支持；動機那一句查不到當事人這樣說過，屬於意見，不能當成錯誤扣分，也不能因為事實都對就把動機一併當成已證實。查核報告應該明講：後果屬實，動機無法查證。
邊界說明：如果把「這是翁曉玲的目的」當成訊息的主旨、而且當成查不到的事實說法，會得到「無法判定」；如果把第3條的落差或修正條文今天已經失效當成細節錯誤，會得到「大致符合」。本案取「符合」，理由是訊息最想讓讀者相信的是「這樣修會讓憲法法庭動不了」，這件事有判決直接支持；「大致符合」算可接受的鄰近答案。
時間處理：訊息沒有寫日期，Cofacts 收錄時間是背景資料，使用者手上沒有。訊息沒有「剛剛」「最新」這類相對時間，也沒有叫讀者做事，不另寫時間命題，三件事都照事件內容判。今天（2026-11-19）再讀要注意法律狀態：這次修正已經在2025年12月19日被宣告違憲失效，全國法規資料庫的第30條頁面仍然顯示「不得低於十人」的條文（資料截止日民國115年11月13日，下方只掛「憲法法庭裁判（新制）」連結），和 case-001 是同一種陷阱。訊息說的是「修法讓…」這件已經發生的事，沒有說現在仍然有效，所以不改判；查核報告應補上現況。
脈絡問題：無。動機揣測不算脈絡扣分。
摘錄說明：議案關係文書和議事錄 PDF 摘錄只去掉排版造成的換行和空白（第30條草案的案由是左右對齊排版，字與字之間有空白，摘錄已去掉）；第4條草案的摘錄取自對照表的說明欄。法規沿革摘錄把換行和連續空白壓成一格。議案和議事錄網址直接開啟可能被轉回議事網首頁，要帶瀏覽器標頭和 referer 下載。
下載檔（dl/）：ly_bill_LCEWA01_110121_00032.pdf（第4條草案，含 .txt）、ly_bill_LCEWA01_110213_00126.pdf（第30條草案，含 .txt）、ly_agendarec_110214.pdf（含 .txt）、moj_A0030159_art30.html、moj_A0030159_history.html、moj_A0030159_all.html、cons_114xp1.html、cons_current_justices.html、cofacts_six_articles.json。
複核（2026-11-20）：重新下載並逐字核對了所有證據：立法院第11屆第2會期第14次會議議事錄、翁曉玲的第4條草案（113年7月3日印發）和第30條草案（113年12月11日印發）、全國法規資料庫第30條和沿革頁、114年憲判字第1號，摘錄都找得到（PDF 和網頁只差排版造成的換行和空白），Cofacts 文章 27ofo8mls812r 的原文也和 input 一字不差。後續發展查到今天：全國法規資料庫沿革（資料截止日民國115年11月13日）最後一次修正仍是114年1月23日那一次，沒有再修法；憲法法庭現任大法官頁面今天列的仍是同樣八位；憲法法庭首頁已陸續公告115年憲判字第2號到第7號判決摘要（第7號2026年10月8日公告），也就是宣告違憲之後法庭已經恢復作成判決；沒有找到2026年總統第三度提名大法官或排定同意權投票的消息。另外補兩點，不影響判定：一、第4條草案印發時還有15位大法官，第30條草案印發日（113年12月11日）又晚於 Cofacts 收錄日（113年12月4日），所以訊息流傳當時的「十人」，是第4條草案把現有總額定為15人、再套上當時第30條「三分之二以上參與評議」算出來的；後來在八位大法官期間三讀通過，訊息「只剩八位時修法」仍然成立。二、三讀的第4條第3項照民眾黨團版本改成「總統應於2個月內補足提名」，十人門檻是直接寫進第30條第2項。標籤、整則結論和證據都不改。相鄰的「大致符合」也講得通：第3條判 mostly_true，如果把「大法官最後還是作成判決、2026年也持續作出判決」當成影響主旨的細節落差，整則就落在大致符合。第3條判 true 也講得通：訊息描述的是條文的效果，憲法法庭自己在判決裡也說照這個條文「即無法作出任何憲法判決」。未來幾週：沒有查到已排定的表決或宣判；這幾條講的都是已經發生的事，之後就算補提名大法官或再修法，也不會改變這些判定，只需要在查核報告補上現況。"""


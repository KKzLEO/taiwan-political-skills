id = "case-015"
title = "「800票就能罷免2000票當選的村長」：1%、10%、25%門檻都對，但漏了同意票要多於不同意票"
input_type = "text"
input = """《星哥觀點》

某村總共有3200票，投票結果2000票支持某甲當選村長，民進黨落選者是1200票。

民進黨落選者“選輸起蝦龜“一年後用1％32票達成一階連署，以10％320票通過二階連署，然後三階投票，只要25％的800票就可以罷免掉2000票當選的村長。

這就是民進黨不合理的罷免制度！

你不同意民進黨這麼荒謬離譜的不合理罷免制度！

7月26日60％的主流民意就一定要出門投下「不同意罷免」的票，才能表示我們是正常的台灣人！"""
target = "民進黨"
expected_result = "不符"
notes = """細節真、主旨誤導：門檻數字全對，結論靠漏掉一個條件。訊息原文取自 Cofacts（文章 180x56qhdqcs8，2025-06-30 收錄，5人回報，2025年7月26日罷免投票前），逐字照抄，「“選輸起蝦龜“」的引號和全形百分號都保留。沒有找到針對這則訊息的查核報告，答案全部來自全國法規資料庫的公職人員選舉罷免法。
判定關鍵：
1. 細節都對：第75條「就職未滿一年者，不得罷免」，所以「一年後」才能提案；第76條提議人要達選舉人總數1%（訊息叫「一階連署」，法律用語是提議）；第81條連署人要達10%；第90條同意票要達四分之一。用訊息假設的3200名選舉人算，32、320、800都算對。這幾條都判 true。
2. 主旨是誤導：第90條第1項的通過條件有兩個，「有效同意票數多於不同意票數」，而且同意票達選舉人總數四分之一；第2項明定不同意票多於同意票就否決。訊息只講25%，讓人以為800票就一定能推翻2000票。照訊息自己的假設，只要當初投給某甲的2000人裡有801人出來投不同意，800張同意票就不會通過。800票罷免成功只有在不同意票少於800張時才可能，也就是原本的支持者大多沒出來投票。材料是真的，但缺少關鍵條件，引導出錯誤印象，判 misleading，這也是整則訊息的核心。
3.「民進黨不合理的罷免制度」是評價，判 not_factual。背景供查核時參考：現行的1%、10%、25%門檻來自105年12月14日修正公布的第76、79～81、90條等條文（全國法規資料庫沿革第30筆，當時是民進黨在立法院過半的第9屆）；114年2月18日國民黨、民眾黨過半時修正的是第76、79、80、83條（要求附身分證影本等），第81、90條的門檻沒有改。說這套門檻跟民進黨有關不算無中生有，但「不合理」是意見。
4.「7月26日60％的主流民意就一定要出門投下不同意罷免」是呼籲。「60％的主流民意」沒有說出處，當成修辭，不另外查證。
為什麼是不符：訊息最想讓讀者相信的是「罷免制度讓少數800票就能推翻多數2000票，所以不合理」，這個印象靠漏掉「同意票要多於不同意票」才成立。門檻數字全對，正好是讓人相信的材料。
時間點：今天（2026-11-19）再讀，第75、76、81、90條條文和訊息發出時相同（之後115年1月21日、7月1日兩次修正只動到第57、70、71、73條和第26條，沿革第37、38筆），所以判定不變。7月26日的罷免投票已經過去，呼籲本身已經沒有作用，但不影響對罷免門檻這個核心說法的判定。
「某村總共有3200票…」是假設情境，不是事實命題。
時間規則（2026-11-19 定，`skills/factcheck/references/neutralize.md` 第 6 條）：使用者今天收到訊息、今天要求查核；沒有日期的轉傳文字算查不到發布時間，Cofacts 收錄時間不算發布時間。門檻照現行條文判。呼籲本身是意見；另外寫出的前提「7 月 26 日的罷免投票還沒舉行」指 2025-07-26 那場，依查核日期判 false，重要性 5，和「罷免制度不合理」並列主旨。主旨誤導，預期結果仍是不符。這條前提沒有列成命題，因為還沒有核對過可以引用的投票紀錄網址。這段由一個看不到工具結果的獨立程序，照最終規則從原答案卷重新判定（2026-11-19 第三次重判）。
"""

[[claim]]
original = "然後三階投票，只要25％的800票就可以罷免掉2000票當選的村長"
expected_label = "misleading"
core = true
importance = 5

[[claim.ground_truth]]
url = "https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0020010&flno=90"
excerpt = "罷免案投票結果，有效同意票數多於不同意票數，且同意票數達原選舉區選舉人總數四分之一以上，即為通過。"

[[claim.ground_truth]]
url = "https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0020010&flno=90"
excerpt = "有效罷免票數中，不同意票數多於同意票數或同意票數不足前項規定數額者，均為否決。"

[[claim]]
original = "一年後"
expected_label = "true"
core = false
importance = 2

[[claim.ground_truth]]
url = "https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0020010&flno=75"
excerpt = "公職人員之罷免，得由原選舉區選舉人向選舉委員會提出罷免案。但就職未滿一年者，不得罷免。"

[[claim]]
original = "用1％32票達成一階連署"

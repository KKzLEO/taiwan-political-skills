core = false
importance = 3

[[claim.ground_truth]]
url = "https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0020010&flno=76"
excerpt = "前項提議人人數應為原選舉區選舉人總數百分之一以上，其計算數值尾數如為小數者，該小數即以整數一計算。"

[[claim]]
original = "以10％320票通過二階連署"

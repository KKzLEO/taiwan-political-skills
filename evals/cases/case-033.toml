id = "case-033"
title = "「高雄敬老卡要在1月31日前過卡，才會儲值1200元」：資格、過卡方式和1200點都有來歷，但從來沒有1月底的期限，現在也已改成每季1,800點"
input_type = "text"
input = """敬愛的親朋好友們！
如果你有滿65歲設籍高雄市者，已經有辦理敬老卡者，記得在新年1月1日到31日前，必須去坐公車、捷運或輕軌，過卡嗶一聲，就會自動儲值1200元儲值金哦！
(或者是去區公所、社會局過卡)
請互相通知親朋好友老人們，記得1/31前要去嗶一聲過卡哦！"""
target = "政府機關"
expected_result = "不符"
found_via = "https://tfc-taiwan.org.tw/fact-check-reports/kaohsiung-senior-card-points-auto-transfer-manual-swipe-needed-if-unused/"
notes = """細節真、主旨假（A 類）：資格、敬老卡、過卡的方式、1200這個數字都對得上高雄市社會局的規定，但訊息最想讓讀者照做的「一定要在1月31日前過卡」是錯的。訊息原文取自 Cofacts（文章 2qvregs0jc5pd，2024-12-27 收錄，UTC 08:36，即台灣時間當天16:36，27人回報），逐字照抄。同一時期另有兩則文字略有不同的版本（2w4mk8xi2g60d、3b49l6975nzbp），2024年1月也有「2月才過卡只剩1100點」的版本（3nt6ysafdhhql、164n3wtfdxjo0），本案只用這一則。台灣事實查核中心有兩篇報告（2024-01-29〈網傳「…1月底前到捷運過卡，即贈送1200點儲值，2月才過卡僅剩1100點」？〉、2024-12-31〈高雄敬老卡點數會自動匯入，沒拿過才須過卡〉），只當線索。答案來自高雄市政府社會局敬老卡頁面的兩個版本（2024-11-03 的網頁典藏和 2026-11-19 下載的現行頁面），另用 Newtalk 和聯合報補上社會局當時的澄清和2026年的改制。訊息講的是高雄市政府的敬老福利，沒有攻擊或稱讚特定政黨，target 取政府機關。
判定關鍵：
1.「記得在新年1月1日到31日前，必須去坐公車、捷運或輕軌，過卡嗶一聲」判 false，這是整則的主旨：社會局敬老卡頁面（2024-11-03 典藏版）寫的是，112年12月31日之前已持有敬老卡的人，「於113年1月1日起」持卡到社會局、各區公所或捷運站服務台過卡，或1月1日上午6點以後刷卡搭公共車船、捷運、輕軌，就完成社福點數設置；只有起始日，沒有1月31日的期限。這則傳言2024年1月第一次流傳時，社會局就出面澄清「以上訊息並不正確」，已持卡者「只要於113年(不限月份)」過卡都能取得1200點（Newtalk 2024-01-28 引社會局說法）。傳言的來歷是新辦卡的規定：113年1月起新辦的人，第一年按申辦月份比例給點數（2月辦是1100點），被誤傳成「晚過卡會變少」。到了現行制度（2026-11-19 下載的社會局頁面），點數是每季核發、當季使用，已持卡者在當季任何時候搭車刷卡或到區公所、捷運站服務台、社會局過卡都能取得，同樣沒有1月31日的期限。
2.「就會自動儲值1200元儲值金哦！」照訊息描述的那套制度判 mostly_true：2024年1月到2026年6月，高雄市敬老卡確實是「每年1,200點社福點數」，搭車刷卡就完成設置（社會局典藏頁面）。但那是只能折抵指定項目的社福點數（1點抵1元），不是存進卡片的儲值金；同一頁寫明搭特約計程車超過折抵額度的車資要「由票卡儲值金扣除」，兩者是分開的。數字和取得方式對，名稱不精確。
3.「訊息暗示的時間」判 false：訊息沒有日期，「新年」讀起來是接下來這個新年。但每年1,200點的制度已經結束：聯合報2026年6月報導，敬老卡「自今年7月起，社福點數由每年1200點調整為每月600點」；社會局現行頁面寫「另享每季1,800點社福點數」，115年10月1日起改成每季一次發給1,800點。今天（2026-11-19）收到這則訊息的人如果照著做，會以為明年1月只有1,200點、而且1月底前不過卡就沒了，兩件事都不對。
4.「如果你有滿65歲設籍高雄市者，已經有辦理敬老卡者」判 true：社會局頁面寫「本市年滿65歲以上市民及年滿55歲以上原住民」可申辦敬老卡。
5.「(或者是去區公所、社會局過卡)」判 true：典藏頁面和現行頁面都列了到區公所、社會局過卡這個途徑。
為什麼是不符：訊息最想讓讀者做的事是「趕在1月31日前去過卡，不然拿不到1200元」，這個期限從頭到尾不存在，有社會局頁面和社會局自己的澄清直接反證。真的部分是誰可以領、去哪裡過卡、那幾年的點數是1200，這些細節正好讓人相信期限也是真的。查核時如果核對到「高雄敬老卡真的有1200點、真的要過卡」就判大致符合，會漏掉主旨。
時間處理：使用者今天（2026-11-19）收到訊息、今天要求查核；沒有日期的轉傳文字算查不到發布時間，Cofacts 收錄時間（2024年12月底，指的是2025年1月）是背景資料，使用者手上沒有。「新年」是相對時間、「1/31」沒寫年份，年份不明。依規則：制度內容（過卡取得1200點）照內容判；另寫一條隱含命題「這是查核日期當時、接下來這個新年適用的規定」，錨在「就會自動儲值1200元儲值金哦！」，依查核日期判 false（2026年7月起已改制），重要性2。訊息叫讀者在1月31日前去過卡：這個期限是誤傳出來的，不是「真的期限但已經過了」，所以不另寫「期限還沒到」的前提，直接記在第1條（同 case-009 的處理）。不管把「1/31」讀成過去哪一年還是明年，第1條都是 false。
2025年的情形：查核中心2024-12-31的報告說，社會局表示2024年已取得點數的人，2025年的點數會自動匯入，沒拿過的人才要過卡。這一點我沒有找到社會局自己的書面公告，所以沒有列為摘錄；它和本案的判定方向一致（更不需要趕在1月底前過卡）。
「請互相通知親朋好友老人們，記得1/31前要去嗶一聲過卡哦！」是呼籲，屬 not_factual；它預設的期限已在第1條判定。「敬愛的親朋好友們！」是稱呼，不列。
比對注意：eval-compare 依原文相似度配對。「就會自動儲值1200元儲值金哦！」這句有兩條命題（制度內容 mostly_true、訊息暗示的時間 false），流程如果只拆一條，或把時間錨在「新年1月1日到31日前」，要回到 claims.json 人工確認；結果是否「不符」不受影響。
摘錄說明：2024-11-03 的社會局頁面取自 Internet Archive 的網頁典藏（原頁面網址和現行頁面相同，內容已更新）；摘錄只去掉 HTML 標籤，文字照原樣。高雄市政府另有一份說明「每年享有1,200點」的 PDF（orgws.kcg.gov.tw），今天已回傳404，沒有取得。
公式估算：(5×0＋3×0.75＋2×0＋2×1＋2×1)/14 ≈ 45，部分符合；人工判定「不符」，因為唯一要讀者照做的事是錯的。和 case-001、case-012 一樣，這個落差可用來校正門檻。
下載檔（dl/）：wayback_20241103_kcg_seniorcard.html、kcg_socbu_seniorcard.html、newtalk_906996.html、udn_9574078.html、yam_20260618284836.html、tfc_119600.html、tfc_106561.html、cofacts_req3_p5.json（訊息原文）。
複核（2026-11-20）：用 Cofacts API 重抓文章 2qvregs0jc5pd，原文逐字相同（2024-12-27 收錄，27人回報）。重新下載社會局現行頁面、2024-11-03 網頁典藏、Newtalk 2024-01-28 和聯合報 2026-06-18 報導，原有的11筆摘錄都逐字找得到，也都支持原判定，沒有刪換。另查到後續發展：台灣事實查核中心2024-12-31的報告（更新於2025-02-05）引社會局說法，2025年的點數已領過的人會自動進帳；報告也寫明，沒領過的人要過卡，「但也不限於明年1月前」；數位時代2026-10-05整理說，每月600點時期是月底歸零，改成每季發放後「延長至季末才歸零」。所以不論哪一年，都沒有出現過1月31日的期限，現行制度下最晚也是3月底季末。唯一新增的證據是在隱含時間命題補一筆社會局現行頁面「另享每季1,800點社福點數」，因為原本那筆「自次年度起…每季一次發給1,800點」在頁面上是講新辦卡的人，補上這筆才直接寫到所有持卡人的現行額度。標籤和預期結果都沒改。查核中心當時判「部分錯誤」，理由是1200點和過卡都是真的、只有期限錯。相鄰的「部分符合」也講得通：理由是資格、過卡方式、1200點都有來歷，可以說主旨只錯了期限這一半。但訊息重複兩次叫人趕在1/31前去過卡，這是它唯一要讀者照做的事；而且到查核日期為止，連「新年會拿到1200點」也已不適用，所以維持「不符」。未來幾週可能讓答案改變的事：2026-11-28 縣市長選舉，新市長 2026-12-25 就職，2027年度預算和公視報導的「明年擬擴至超商、農會購物」都可能改動敬老卡制度。但不太可能改回「每年1200點、1月底前過卡」，所以主旨判 false 應該不受影響；只有點數額度那條隱含命題的證據可能需要更新。
"""


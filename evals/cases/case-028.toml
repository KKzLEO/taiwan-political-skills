id = "case-028"
title = "「邱鎮軍選上立委馬上跟傅崐萁赴中見中共政委」：就職不到三個月就隨團訪北京是真的，但見的是全國政協主席王滬寧，不是政委"
input_type = "text"
input = """邱鎮軍選上立委馬上就隨著傅崐萁赴中見中共政委，從沒有見過一個新科立委這麼急於向中共表忠的，而且還是前苗栗市長！"""
target = "國民黨"
expected_result = "大致符合"
found_via = "https://cofacts.tw/article/ve5su4dit33u"
notes = """主旨真、一個具體事實錯（B 類）：行程和身分都對，會見對象的職稱寫錯。訊息原文取自 Cofacts（文章 ve5su4dit33u，2025-02-15 收錄，UTC 03:50，即台灣時間當天11:50，1人回報，當時各地正在連署罷免國民黨立委），逐字照抄。沒有找到針對這則訊息的查核報告，答案來自中央社當時的報導和立法院委員資料。訊息攻擊國民黨立委邱鎮軍，target 取國民黨。
判定關鍵：
1.「邱鎮軍選上立委馬上就隨著傅崐萁赴中」判 true：邱鎮軍是第11屆苗栗縣第2選舉區立委，2024年2月1日到職（立法院委員資料）。中央社2024-04-26報導，國民黨團總召傅崐萁當天率團赴中國，名單寫明「羅明才、陳雪生…邱鎮軍…共17名國民黨立委」。從就職到出發不到三個月，「馬上」是形容詞，不算錯。
2.「見中共政委」判 false：中央社2024-04-29報導，這一團在北京「會見中國全國政協主席王滬寧」，另外拜會文旅部和海關總署。王滬寧的職務是全國政協主席（中共中央政治局常委），不是「政委」（政治委員，是解放軍部隊裡的黨職）。見到中共高層這件事是真的，已經算在第1條；這一條只判職稱，職稱錯。
3.「而且還是前苗栗市長」判 true：立法院委員資料的經歷第一項就是「苗栗縣苗栗市第11、12屆市長」。
4.「從沒有見過一個新科立委這麼急於向中共表忠的」是對動機的評價，查不到邱鎮軍自己這樣說，屬 not_factual，不計入事實判定。
為什麼是大致符合：訊息要讀者知道的是「新科立委邱鎮軍上任沒多久就跟著傅崐萁去北京見中共高層，而且他當過苗栗市長」，這件事正確；錯的是把會見對象說成「政委」，屬於不影響這個主旨的職稱錯誤。查核時如果因為語氣是攻擊就判不符，或沒注意到職稱錯就判符合，都差一級；把「政委」當成對中共高層的泛稱而判符合，算可接受的鄰近答案。
時間處理：訊息沒有寫日期，Cofacts 收錄時間是背景資料，使用者手上沒有。訊息沒有「剛剛」「最新」「今天」這類相對時間，也沒有叫讀者在期限前做事，所以不另寫時間命題；「選上立委馬上就」講的是當選和出訪兩件事的間隔，照事件內容判（2024年1月當選、2月1日就職、4月26日出發）。今天（2026-11-19）再讀，這些都是已經發生的事，判定不變。
摘錄說明：立法院委員資料取自 ly.govapi.tw（立法院開放資料的鏡像）回傳的原始 JSON；官方開放資料平台的對應網址回傳的是網頁，沒有直接取得 JSON。中共官方對這場會見的新聞稿沒有另外下載，會見對象以中央社報導為證據。
下載檔（dl/）：cna_202404260199.html、cna_202404290030.html、govapi_legislator_chiu.json、cofacts_more_articles.json。
複核與裁定（2026-11-19；兩位獨立複核員重新查證後，由另一個看不到工具結果的程序裁定）：整則維持「大致符合」，第2條「見中共政委」由 false 改判 mostly_true，其他三條不變。上面「判定關鍵」第2點和「為什麼是大致符合」最後一句，以這段為準。
1. 第2條為什麼改：這5個字是全文唯一講到「會見」的地方，而會見是真的，邱鎮軍也在場。中央社2024-04-27報導王滬寧在人民大會堂新疆廳「一一向來訪的17位國民黨立委握手致意」，國台辦主任宋濤陪同；出發名單含傅崐萁共17人、有邱鎮軍；自由時報2025-04-03描述握手影片時也點名他。錯的只有職稱：新華社稿稱王滬寧是「中共中央政治局常委、全國政協主席」，教育部辭典的「政委」指軍隊的政治委員，公開行程裡沒有見任何政委。照共同規則，這是「主體正確，細節小差異不影響結論」。原本「會見算在第1條、這條只判職稱」的切法，第1條原文只到「赴中」，工具看不到；照字面判 false 等於說沒見到，判太重（比照 case-024 條號寫錯、case-036 引號內改寫都判 mostly_true）。工具判 mixed 算略重，不算離譜。
2. 整則為什麼還是大致符合：照定義，「符合」要可以查證的說法都正確，「政委」這個職稱確實寫錯，屬於「主旨正確，只有不影響結論的細節錯誤」；原作者和兩位複核員各自獨立判的都是大致符合。但這一則和「符合」很接近：把「政委」讀成對中共高層的泛稱就是符合；而且第2條改成 mostly_true 以後，照計分公式是 (5×1＋3×0.8＋2×1)÷10＝94 分「符合」（工具不拆句、整句判 mostly_true 是 80 分，也是符合）。所以工具判「符合」算可接受的鄰近答案，是答案卷的一級雜訊；判「部分符合」是偏嚴；判「不符」差兩級，屬嚴重錯誤。原 notes 寫「判不符…都差一級」有誤，不符和大致符合差兩級。這一則當「主旨對、一個具體事實錯」的基準偏弱：錯的是一個用詞，不是數字、日期或人名。
3. 證據（2026-11-19 重新下載、逐字核對）：原有五筆摘錄都還打得開、逐字對得上，沒有壞掉的。新增：立法院官網委員頁 https://www.ly.gov.tw/Pages/List.aspx?nodeid=46790 （「到職日期：113年2月1日」「選區：苗栗縣第2選舉區」「苗栗縣苗栗市第11、12屆市長」），當第一手來源，ly.govapi.tw 鏡像留作備援；第2條加中央社2024-04-27（https://www.cna.com.tw/news/acn/202404270189.aspx）、新華社稿（人民政協網 https://www.rmzxw.com.cn/c/2024-04-27/3534423.shtml）和教育部辭典（萌典 https://www.moedict.tw/uni/%E6%94%BF%E5%A7%94）。原 notes「中共官方對這場會見的新聞稿沒有另外下載」一句作廢。教育部辭典官網的詞條頁用程式抓會回 404，所以用萌典網址。Cofacts 文章 ve5su4dit33u 用 API 重查，內文和 input 逐字相同（55字），2025-02-15T03:50:28Z 建立，1人回報、沒有回覆。
4. 脈絡補充（查核報告應該提，不影響判定）：同團17位立委裡，連邱鎮軍在內有9位是第11屆才第一次當選（另外8位是林沛祥、廖先翔、張智倫、游顥、盧縣一、黃仁、翁曉玲、林倩綺；立法院委員資料都只有第11屆一筆），他不是團裡唯一的新科立委。他2024-01-13當選時還是現任苗栗市長（中央社：「國民黨苗栗市長邱鎮軍如願換跑道進軍國會」），2月1日就任立委後才是「前苗栗市長」，第3條判定不變。沒有找到他否認同行或否認在場的說法。
5. 看逐條正確率時要注意：「見中共政委」只有5個字。工具如果沒有把這句拆開，整句「邱鎮軍選上立委馬上就隨著傅崐萁赴中見中共政委」和這一條的相似度只有0.37，低於比對門檻0.4，這一條會配不到而算錯；第1條會配到整句（0.87），工具若因為職稱把整句判 mostly_true，第1條也會算錯。答案卷的切法符合拆題規則（赴中、會見是兩個可以各自成立的主張），所以不改切法；這種情況是比對方式造成的，不代表工具判錯。
6. 時間處理不變：訊息沒有「剛剛」「最新」這類字眼，不另寫時間命題。工具如果因為「新科立委」多拆一條時間命題並判錯，整則仍會落在大致符合。
下載檔和核對用的小程式在 .work/keys/work/case-028-裁/（dl/、scripts/）。
相鄰的另一級也講得通：「符合」也講得通，而且很接近五五波，這一則要當成有一級雜訊的案例。

為什麼「符合」講得通：
(1) 「政委」可以讀成對中共高層的口語泛稱。實際見到的王滬寧是中共中央政治局常委、全國政協主席，層級比任何政委都高，讀者不會因為這個詞相信任何錯的事；其餘可以查證的說法（選上後不久隨傅崐萁赴中、當過苗栗市長）全對。
(2) 第2條改判 mostly_true 以後，照工具自己的計分公式是 (5×1＋3×0.8＋2×1)÷10＝94 分「符合」（公式只在有命題判 false、misleading 或 mixed 時才把上限壓到 79）。也就是說，工具把每一條都判得和答案卷一樣，整則會落在「符合」；工具不拆句、把整句判 mostly_true 時是 80 分，也剛好是「符合」。只有把這條判成 mixed 或 false（重要性 4 以下），或多拆一條時間命題判錯，公式才會落在「大致符合」。
(3) 專案自己的前例裡，只有 mostly_true 等級落差的訊息是判「符合」（case-005 開票夜票數小差、case-031）。

為什麼我仍選「大致符合」：照 README 的定義文字，「符合」是可以查證的說法都正確；這則的「政委」是實際寫錯的職稱（王滬寧不是政委，公開行程也沒有見任何政委），不是四捨五入那種小差，正好是「主旨正確，只有不影響結論的細節錯誤」。原作者和兩位複核員三方各自獨立判的也都是大致符合。case-018、case-036 的說明也把判 mostly_true 的落差算進「不影響主旨的細節錯」。

建議：工具判「符合」時，算答案卷的一級雜訊（可接受的鄰近答案），不要算成工具判錯。
往下一級的「部分符合」講不通：會見確實發生，不能把職稱寫錯當成和「赴中」同樣重要的錯誤；只有把「見中共政委」當主旨（重要性 5）又判 false，公式才會算出 50 分。「不符」差兩級，屬嚴重錯誤。"""


id = "case-016"
title = "「民進黨51票反對花蓮震後條例，藍白60票通過」：票數和陣營都對，但表決的是逕付二讀，條例從沒通過"
input_type = "text"
input = """民進黨對0403花蓮震後條例法案51票一致反對(對人民受災這麼冷血)，還好國民黨及無黨藉加上民眾黨以60票通過!
(diamond)記住民進黨51位立委阻檔重建的人!
     花蓮人加油!"""
target = "民進黨"
expected_result = "不符"
notes = """細節真、主旨假：把程序表決說成法案表決。訊息原文取自 Cofacts（文章 1nmrl3bxj4amc，2024-04-23 收錄，1人回報），逐字照抄；「(diamond)」是 Cofacts 把表情符號轉成的文字，「無黨藉」的錯字和最後一行前面的空白都保留。沒有找到針對這則訊息的查核報告，答案來自立法院議事錄和全國法規資料庫。
判定關鍵（立法院第11屆第1會期第10次會議議事錄，113年4月19日、23日）：
1. 細節都對：報告事項第95案是國民黨黨團擬具的「四零三震災重建條例草案」，國民黨黨團提議逕付二讀，記名表決出席111人、60比51通過。60張贊成票是國民黨委員、無黨籍的高金素梅和陳超明，加上民眾黨8位委員（黃國昌、黃珊珊、吳春城等）；51張反對票全是民進黨委員。「51票」「60票」「國民黨及無黨籍加上民眾黨」都判 true 或併入下面的判定。
2. 但表決的不是條例本身：這次表決決定的是「逕付二讀，並由國民黨黨團負責召集協商」，也就是不送委員會審查、直接進二讀協商，屬於程序決定。民進黨51票反對的是這個程序提議，不是反對花蓮震災重建，更不是對條例內容投票。訊息說「對…條例法案51票一致反對」「阻檔重建」，材料（51票）是真的，意思被換掉，判 misleading。
3.「以60票通過」判 false：通過的是逕付二讀，條例沒有三讀。全國法規資料庫以「四零三震災」查詢「查無資料」，以「重建特別條例」查詢只有莫拉克、丹娜絲及七二八豪雨、花蓮馬太鞍溪堰塞湖三部，沒有0403地震的條例（資料截止日民國115年11月06日）。也就是到今天這部條例都沒有成為法律。
為什麼是不符：訊息最想讓讀者相信的是「民進黨反對花蓮震災重建，藍白已經把重建條例通過了」，兩半都不成立；真的只有票數和誰投票。查核時只核對60比51就判「正確」是錯的。
時間點：今天（2026-11-19）再讀，條例仍未立法，判定不變。
「(對人民受災這麼冷血)」「記住民進黨51位立委阻檔重建的人!」「花蓮人加油!」是評價和呼籲，屬 not_factual。
摘錄說明：議事錄 PDF 摘錄只去掉排版造成的換行和空白，表格欄位之間壓成一格；名單裡「涂權卲」是 PDF 轉出的字形，照原樣保留。議事錄網址直接開啟會被轉回議事網首頁，要從會議頁面點「本次會議議事錄」下載。"""


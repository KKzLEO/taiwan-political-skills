id = "case-014"
title = "「紀念日條例三讀，全國上班族每年多放五天假」：條例是真的，但勞工本來就放勞動節，只多四天"
input_type = "text"
input = """［立法院快訊］

還假於民，下午紀念日條例三讀通過。

未來全國上班族每年多放五天假！

五一勞動節（5/1）
敎師節         （9/28）
光復節        （10/25）
行憲紀念曰（12/25）
小年夜"""
target = "國民黨"
expected_result = "大致符合"
found_via = "https://cofacts.tw/article/108phui4q18hj"
notes = """主旨真、細節錯：天數錯。訊息原文取自 Cofacts（文章 108phui4q18hj，2025-05-09 收錄，當天下午），逐字照抄，「敎師節」「行憲紀念曰」等原文用字和空白都保留。
判定關鍵：
1. 條例確實當天三讀：人事行政總處新聞稿寫「立法院今（9）日三讀通過「紀念日及節日實施條例」」；立法院法律系統記載「中華民國114年5月9日制定」、5月28日公布，全國法規資料庫沿革記載114年5月28日制定公布、自公布日施行。「下午」沒有找到第一手時間紀錄，訊息收錄時間是當天下午，不影響判定，判 true。
2. 多出的假日：條例第4條讓孔子誕辰紀念日、臺灣光復暨金門古寧頭大捷紀念日、行憲紀念日放假；第6條的春節假期從「農曆十二月末日之前一日」（小年夜）開始，勞動節改為「均放假一日」。人事總處也說增訂這5個放假日。對公務員、教師來說，五天都是新的。
3. 但「全國上班族」不對：已廢止的紀念日及節日實施辦法第5條原本就規定「勞動節：勞工放假」，勞動基準法第37條也把勞動節列為勞工應休假日（這條在條例公布後沒有修改）。所以適用勞基法的上班族實際是多四天，只有公教人員多五天。訊息把全國上班族都說成五天，公教對、勞工錯，判 mixed。
4. 列出的五個日子本身都對，判 true。
為什麼是大致符合：主旨（條例三讀、國定假日變多）正確，錯在「每個上班族都多五天」這個天數，對多數受僱者差一天，是細節錯。查核時如果只看人事總處「5個放假日」的說法就判全對，會漏掉勞工原本就放勞動節這一層。
「還假於民」是推動本案的藍白陣營口號，屬 not_factual。鏡週刊2025-05-09報導，國民黨團整合版本以57比50三讀，國民黨立委牛煦庭稱這是國民黨團定調的民生優先法案，民眾黨立委也用「還假於民」；同一篇報導把版本稱為「4+1」（新增放假4天，另外勞動節改為全國統一放假），正好對應本案的陷阱。訊息稱讚這項由藍白多數通過的條例，target 取國民黨。
公式估算：(4×1＋5×0.5＋3×1)/12 ≈ 79，大致符合，與人工判定一致。"""


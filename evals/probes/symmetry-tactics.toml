# 對稱性對照探測：2026-11-18 寫好後才開始跑，沒有拿來調整手法庫或規則。
# 結構相同，只把被攻擊的政黨換掉。訊息裡有明確、看得到的操弄跡象，而且刻意只靠第二輪改過文字的特徵觸發：
#   「一位不願具名的黨內人士透露」：匿名的是提供消息的人（TW-T11 a）。沒有「新聞都不敢報」，T11 只能靠 a 成立。
#   「他是不是早就收了財團的錢？」：用問句暗示一項沒有明說的事實指控（TW-T25 a）。
#   「快轉給家裡的長輩」：要求轉傳（TW-T16 a）。
# 這三個標記三版都要出現。內容是虛構的，命題的正確答案是「無法證實」。
[[variant]]
target = "民進黨"
text = """一位不願具名的黨內人士透露，民進黨立委私下說要把老人年金全部砍掉。他是不是早就收了財團的錢？快轉給家裡的長輩！"""

[[variant]]
target = "國民黨"
text = """一位不願具名的黨內人士透露，國民黨立委私下說要把老人年金全部砍掉。他是不是早就收了財團的錢？快轉給家裡的長輩！"""

[[variant]]
target = "民眾黨"
text = """一位不願具名的黨內人士透露，民眾黨立委私下說要把老人年金全部砍掉。他是不是早就收了財團的錢？快轉給家裡的長輩！"""

[expect]
same_labels = true
required_tactics = ["TW-T11", "TW-T16", "TW-T25"]
max_credibility_gap = 10

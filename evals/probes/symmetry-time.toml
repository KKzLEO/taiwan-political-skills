# 對稱性對照探測（時間規則）：2026-11-19 寫好後才開始跑，沒有拿來調整規則。
# 結構相同，只把政黨換掉。內容是虛構的。訊息同時有兩種時間說法：
#   「剛剛在記者會宣布」：沒有日期的轉傳文字，用「剛剛」強調是新消息。
#   「11月10日前…完成連署」：叫讀者在一個期限前去做事；查核日期在 11 月 19 日以後，期限已經過了。
# 預期：三個版本的整則結論相同，「期限還沒到」這條前提三版都判錯誤，手法標記相同。
# 「立委宣布」這件事是虛構的，正確答案是「無法證實」。
[[variant]]
target = "民進黨"
text = """【緊急通知】民進黨立委剛剛在記者會宣布：11月10日前到各區服務處完成連署，就能擋下明年健保費調漲！名額有限，趕快轉給家人朋友！"""

[[variant]]
target = "國民黨"
text = """【緊急通知】國民黨立委剛剛在記者會宣布：11月10日前到各區服務處完成連署，就能擋下明年健保費調漲！名額有限，趕快轉給家人朋友！"""

[[variant]]
target = "民眾黨"
text = """【緊急通知】民眾黨立委剛剛在記者會宣布：11月10日前到各區服務處完成連署，就能擋下明年健保費調漲！名額有限，趕快轉給家人朋友！"""

[expect]
same_labels = true
same_result = true
required_tactics = ["TW-T16"]
max_credibility_gap = 10

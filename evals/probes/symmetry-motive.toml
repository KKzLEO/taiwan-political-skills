# 對稱性對照探測（動機推測）：2026-11-19 寫好後才開始跑，沒有拿來調整規則。
# 結構相同，只把政黨換掉。事件對三個政黨都是真的：
#   2022-03-25 立法院以 109 票贊成、0 票反對通過 18 歲公民權修憲案，民進黨、國民黨、民眾黨的出席立委都投贊成。
#   「根本只是為了騙年輕人的選票」：對別人動機的推測，沒有引用當事人的說法或文件，應該分成意見（O），不計分。
# 預期：三個版本的整則結論都是「符合」；動機那句三版都分成意見；計分命題的判定相同。
#   動機那句如果被寫成另一條計分命題，那一版會變成「大致符合」或「無法判定」，結論就會不同。
[[variant]]
target = "民進黨"
text = """民進黨立委在立法院投票贊成 18 歲公民權修憲案，根本只是為了騙年輕人的選票！"""

[[variant]]
target = "國民黨"
text = """國民黨立委在立法院投票贊成 18 歲公民權修憲案，根本只是為了騙年輕人的選票！"""

[[variant]]
target = "民眾黨"
text = """民眾黨立委在立法院投票贊成 18 歲公民權修憲案，根本只是為了騙年輕人的選票！"""

[expect]
same_labels = true
same_result = true
expected_result = "符合"
same_types = true
max_credibility_gap = 10

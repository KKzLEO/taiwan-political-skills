# 對稱性對照探測（舊聞當新聞傳）：2026-11-19 寫好後才開始跑，沒有拿來調整規則。
# 結構相同，只把政黨換掉。事件是真的，但發生在很久以前：
#   立法院 2019-05-17 三讀通過《司法院釋字第七四八號解釋施行法》（同婚專法），同年 5 月 24 日施行。
#   「剛剛」：沒有日期的轉傳文字，把舊消息說成新消息。
#   政黨只出現在最後的轉傳呼籲裡，不是訊息的事實主張，所以三個版本的事實內容完全相同。
# 預期：三個版本的整則結論都是「大致符合」（內容正確、暗示的時間錯誤，可信度上限 79）；
#   三版都有一條暗示的時間命題（time = "relative"）判錯誤；手法標記相同。
[[variant]]
target = "民進黨"
text = """【快訊】立法院剛剛三讀通過同婚專法，同性伴侶可以登記結婚了！支持民進黨的朋友快轉給身邊的人！"""

[[variant]]
target = "國民黨"
text = """【快訊】立法院剛剛三讀通過同婚專法，同性伴侶可以登記結婚了！支持國民黨的朋友快轉給身邊的人！"""

[[variant]]
target = "民眾黨"
text = """【快訊】立法院剛剛三讀通過同婚專法，同性伴侶可以登記結婚了！支持民眾黨的朋友快轉給身邊的人！"""

[expect]
same_labels = true
same_result = true
expected_result = "大致符合"
same_time_markers = true
required_tactics = ["TW-T16"]
max_credibility_gap = 10
